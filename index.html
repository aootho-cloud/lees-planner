// ============================================================================
// reports.js — Weekly / Monthly / Yearly reviews. Every number here comes
// from stored entries; when there isn't enough data, we say so instead of
// guessing.
// ============================================================================

const ReportsScreen = (() => {
  let activeTab = 'weekly';
  let weekOffset = 0;   // 0 = current week (last 7 days ending today)
  let monthOffset = 0;  // 0 = current calendar month
  let yearOffset = 0;   // 0 = current calendar year

  async function render(root) {
    root.innerHTML = '';
    const tabs = UI.el('div', { class: 'report-tabs' }, [
      UI.el('button', { class: activeTab === 'weekly' ? 'active' : '', onclick: () => { activeTab = 'weekly'; render(root); } }, 'Weekly'),
      UI.el('button', { class: activeTab === 'monthly' ? 'active' : '', onclick: () => { activeTab = 'monthly'; render(root); } }, 'Monthly'),
      UI.el('button', { class: activeTab === 'yearly' ? 'active' : '', onclick: () => { activeTab = 'yearly'; render(root); } }, 'Yearly'),
    ]);
    root.appendChild(tabs);
    const body = UI.el('div');
    root.appendChild(body);
    if (activeTab === 'weekly') await renderWeekly(body);
    else if (activeTab === 'monthly') await renderMonthly(body);
    else await renderYearly(body);
  }

  function numFmt(v) { return Math.abs(v - Math.round(v)) < 0.01 ? Math.round(v) : Math.round(v * 10) / 10; }

  async function trackerStatsInRange(tracker, startKey, endKey) {
    const entries = await Trackers.entriesInRange(tracker.id, startKey, endKey);
    const cons = await Trackers.consistency(tracker, startKey, endKey);
    return { entries, cons };
  }

  // ---- WEEKLY --------------------------------------------------------------

  async function renderWeekly(body) {
    const todayKey = DateUtil.todayKey();
    const endKey = DateUtil.addDays(todayKey, -7 * weekOffset);
    const startKey = DateUtil.addDays(endKey, -6);
    const prevEnd = DateUtil.addDays(startKey, -1);
    const prevStart = DateUtil.addDays(prevEnd, -6);

    body.appendChild(navRow(
      `${DateUtil.formatShort(startKey)} – ${DateUtil.formatShort(endKey)}`,
      () => { weekOffset++; render(document.getElementById('screen-reports')); },
      weekOffset > 0 ? () => { weekOffset--; render(document.getElementById('screen-reports')); } : null,
    ));

    const trackers = await Trackers.listTrackers();
    const rows = [];
    for (const t of trackers) {
      const { entries, cons } = await trackerStatsInRange(t, startKey, endKey);
      if (entries.length === 0) continue;
      rows.push({ tracker: t, entries, cons });
    }

    if (rows.length === 0) {
      body.appendChild(UI.el('div', { class: 'empty-state' }, [UI.el('h3', {}, 'Nothing logged this week'), UI.el('p', {}, 'Log a few trackers on Today and come back.')]));
      return;
    }

    body.appendChild(UI.el('h3', { class: 'section-title' }, 'This week'));
    const metricWrap = UI.el('div', { class: 'trend-card' });
    for (const r of rows) metricWrap.appendChild(await metricRow(r.tracker, r.entries, startKey, endKey, prevStart, prevEnd));
    body.appendChild(metricWrap);

    // Best/worst by consistency (only trackers with a goal)
    const withGoal = rows.filter((r) => r.tracker.goalDirection !== 'none' && r.cons.expected > 0);
    const best = withGoal.slice().sort((a, b) => b.cons.pct - a.cons.pct)[0];
    const worst = withGoal.slice().sort((a, b) => a.cons.pct - b.cons.pct)[0];

    body.appendChild(UI.el('h3', { class: 'section-title' }, 'What went well'));
    if (best && best.cons.pct >= 50) {
      body.appendChild(UI.el('div', { class: 'callout good' }, `${best.tracker.name} was your strongest tracked goal this week — reached on ${best.cons.completed} of ${best.cons.expected} expected days (${best.cons.pct}%).`));
    } else {
      body.appendChild(UI.el('div', { class: 'callout neutral' }, 'No tracker cleared its goal on most days this week — that\u2019s useful to know, not a failure.'));
    }

    body.appendChild(UI.el('h3', { class: 'section-title' }, 'Needs attention'));
    if (worst && worst.cons.pct < 70 && worst !== best) {
      body.appendChild(UI.el('div', { class: 'callout attention' }, `${worst.tracker.name}'s goal was reached on only ${worst.cons.completed} of ${worst.cons.expected} expected days (${worst.cons.pct}%).`));
    } else {
      body.appendChild(UI.el('div', { class: 'callout neutral' }, 'Nothing stands out as needing attention this week.'));
    }

    body.appendChild(UI.el('h3', { class: 'section-title' }, 'Patterns'));
    const weekdayVsWeekend = await weekdayWeekendPattern(rows.map((r) => r.tracker), startKey, endKey);
    body.appendChild(UI.el('div', { class: 'callout neutral' }, weekdayVsWeekend));

    body.appendChild(UI.el('h3', { class: 'section-title' }, 'Next week'));
    if (worst && worst.cons.pct < 90) {
      const nextTarget = Math.min(worst.cons.expected, worst.cons.completed + 2);
      body.appendChild(UI.el('div', { class: 'callout good' }, `Don\u2019t add another goal yet. Try getting ${worst.tracker.name} to at least ${nextTarget} of ${worst.cons.expected} days next week.`));
    } else {
      body.appendChild(UI.el('div', { class: 'callout good' }, 'Everything tracked with a goal is in good shape — a quiet week to simply keep going.'));
    }
  }

  async function metricRow(tracker, entries, startKey, endKey, prevStart, prevEnd) {
    const isTime = tracker.type === 'time';
    const toNum = (v) => (isTime ? (() => { const [h, m] = String(v).split(':').map(Number); return h * 60 + m; })() : Number(v));
    const fromNum = (n) => (isTime ? `${String(Math.floor(n / 60) % 24).padStart(2, '0')}:${String(Math.round(n % 60)).padStart(2, '0')}` : numFmt(n));

    let sub = '';
    let changeStr = '';
    let changeClass = '';
    if (['number', 'duration', 'currency', 'count', 'rating', 'time'].includes(tracker.type)) {
      const vals = entries.map((e) => toNum(e.value)).filter((v) => !Number.isNaN(v));
      if (vals.length >= 2) {
        const change = vals[vals.length - 1] - vals[0];
        changeStr = `${change > 0 ? '+' : ''}${fromNum(change)}`;
        changeClass = change === 0 ? '' : (tracker.goalDirection === 'atmost' ? (change < 0 ? 'up' : 'down') : (change > 0 ? 'up' : 'down'));
        sub = `${fromNum(vals[0])} → ${fromNum(vals[vals.length - 1])}`;
      } else if (vals.length === 1) {
        sub = fromNum(vals[0]);
      }
    } else if (tracker.type === 'yesno') {
      const yes = entries.filter((e) => e.value === true || e.value === 'true').length;
      sub = `Yes on ${yes} of ${entries.length} logged days`;
    } else {
      sub = `${entries.length} entries`;
    }

    return UI.el('div', { class: 'metric-row' }, [
      UI.el('div', { class: 'left' }, [
        UI.el('span', { class: 'icon' }, tracker.icon),
        UI.el('div', {}, [UI.el('div', { class: 'name' }, tracker.name), UI.el('div', { class: 'sub' }, sub)]),
      ]),
      changeStr ? UI.el('div', { class: 'right' }, [UI.el('div', { class: `change ${changeClass}` }, changeStr)]) : UI.el('div', {}),
    ]);
  }

  async function weekdayWeekendPattern(trackers, startKey, endKey) {
    const withGoal = trackers.filter((t) => t.goalDirection !== 'none');
    if (withGoal.length === 0) return 'Not enough goal-based trackers yet to compare weekdays and weekends.';
    let weekdayHit = 0, weekdayTotal = 0, weekendHit = 0, weekendTotal = 0;
    for (const t of withGoal) {
      const entries = await Trackers.entriesInRange(t.id, startKey, endKey);
      for (const e of entries) {
        const reached = Trackers.goalReached(t, e.value);
        if (reached === null) continue;
        if (DateUtil.isWeekend(e.date)) { weekendTotal++; if (reached) weekendHit++; }
        else { weekdayTotal++; if (reached) weekdayHit++; }
      }
    }
    if (weekdayTotal === 0 || weekendTotal === 0) return 'Not enough spread across weekdays and weekends yet to compare them.';
    const wdPct = Math.round((weekdayHit / weekdayTotal) * 100);
    const wePct = Math.round((weekendHit / weekendTotal) * 100);
    if (wdPct === wePct) return `Your routine was equally consistent on weekdays and weekends (${wdPct}%).`;
    const stronger = wdPct > wePct ? 'weekdays' : 'weekends';
    return `Your routine was more consistent on ${stronger} (${Math.max(wdPct, wePct)}%) than the other days (${Math.min(wdPct, wePct)}%).`;
  }

  // ---- MONTHLY ---------------------------------------------------------------

  async function renderMonthly(body) {
    const now = new Date();
    const monthDate = new Date(now.getFullYear(), now.getMonth() - monthOffset, 1);
    const startKey = DateUtil.toDateKey(monthDate);
    const lastDay = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0);
    const endKeyRaw = DateUtil.toDateKey(lastDay);
    const endKey = endKeyRaw > DateUtil.todayKey() ? DateUtil.todayKey() : endKeyRaw;

    body.appendChild(navRow(
      DateUtil.formatMonthYear(startKey),
      () => { monthOffset++; render(document.getElementById('screen-reports')); },
      monthOffset > 0 ? () => { monthOffset--; render(document.getElementById('screen-reports')); } : null,
    ));

    const trackers = await Trackers.listTrackers({ includeArchived: true });
    const rows = [];
    for (const t of trackers) {
      const entries = await Trackers.entriesInRange(t.id, startKey, endKey);
      if (entries.length === 0) continue;
      const cons = await Trackers.consistency(t, startKey, endKey);
      rows.push({ tracker: t, entries, cons });
    }

    if (rows.length === 0) {
      body.appendChild(UI.el('div', { class: 'empty-state' }, [UI.el('h3', {}, 'No data for this month')]));
      return;
    }

    const goalRows = rows.filter((r) => r.tracker.goalDirection !== 'none' && r.cons.expected > 0);
    const overallPct = goalRows.length ? Math.round(goalRows.reduce((a, r) => a + r.cons.pct, 0) / goalRows.length) : null;

    body.appendChild(UI.el('div', { class: 'report-hero' }, [
      overallPct !== null ? UI.el('div', { class: 'title' }, `${overallPct}% overall consistency`) : UI.el('div', { class: 'title' }, 'Monthly review'),
    ]));

    const metricWrap = UI.el('div', { class: 'trend-card' });
    for (const r of rows) metricWrap.appendChild(await metricRow(r.tracker, r.entries, startKey, endKey));
    body.appendChild(metricWrap);

    if (goalRows.length) {
      const strongest = goalRows.slice().sort((a, b) => b.cons.pct - a.cons.pct)[0];
      const weakest = goalRows.slice().sort((a, b) => a.cons.pct - b.cons.pct)[0];
      body.appendChild(UI.el('div', { class: 'callout good' }, `Strongest tracker: ${strongest.tracker.name} (${strongest.cons.pct}% consistency).`));
      if (weakest !== strongest) body.appendChild(UI.el('div', { class: 'callout attention' }, `Least consistent: ${weakest.tracker.name} (${weakest.cons.pct}% consistency).`));
    }

    body.appendChild(UI.el('h3', { class: 'section-title' }, 'Weekday vs. weekend'));
    body.appendChild(UI.el('div', { class: 'callout neutral' }, await weekdayWeekendPattern(rows.map((r) => r.tracker), startKey, endKey)));

    // First half vs second half of month = improving/declining
    const mid = DateUtil.addDays(startKey, Math.floor(DateUtil.daysBetween(startKey, endKey) / 2));
    body.appendChild(UI.el('h3', { class: 'section-title' }, 'Improving or declining'));
    let anyComparison = false;
    for (const r of goalRows) {
      const firstHalf = await Trackers.consistency(r.tracker, startKey, mid);
      const secondHalf = await Trackers.consistency(r.tracker, DateUtil.addDays(mid, 1), endKey);
      if (firstHalf.expected < 2 || secondHalf.expected < 2) continue;
      anyComparison = true;
      const diff = secondHalf.pct - firstHalf.pct;
      if (Math.abs(diff) >= 15) {
        body.appendChild(UI.el('div', { class: `callout ${diff > 0 ? 'good' : 'attention'}` }, `${r.tracker.name} went from ${firstHalf.pct}% to ${secondHalf.pct}% consistency across the month.`));
      }
    }
    if (!anyComparison) body.appendChild(UI.el('div', { class: 'callout neutral' }, 'Not enough data yet to compare the first and second half of the month.'));

    // Life events overlay
    const events = (await DB.getAll('lifeEvents')).filter((ev) => overlaps(ev.startDate, ev.endDate || ev.startDate, startKey, endKey));
    if (events.length) {
      body.appendChild(UI.el('h3', { class: 'section-title' }, 'Life events this month'));
      events.forEach((ev) => body.appendChild(UI.el('div', { class: 'callout neutral' }, `${ev.name}: ${DateUtil.formatShort(ev.startDate)}${ev.endDate && ev.endDate !== ev.startDate ? ` – ${DateUtil.formatShort(ev.endDate)}` : ''}${ev.note ? ` — ${ev.note}` : ''}`)));
    }

    body.appendChild(UI.el('h3', { class: 'section-title' }, 'Month in one sentence'));
    const sentenceParts = [];
    if (goalRows.length) {
      const strongest = goalRows.slice().sort((a, b) => b.cons.pct - a.cons.pct)[0];
      sentenceParts.push(`you made steady progress with ${strongest.tracker.name.toLowerCase()}`);
    }
    body.appendChild(UI.el('div', { class: 'callout good' }, sentenceParts.length ? `This month, ${sentenceParts.join(', ')}.` : 'Keep logging — a one-sentence summary needs a little more data to be accurate.'));
  }

  function overlaps(aStart, aEnd, bStart, bEnd) { return aStart <= bEnd && aEnd >= bStart; }

  // ---- YEARLY --------------------------------------------------------------

  async function renderYearly(body) {
    const now = new Date();
    const year = now.getFullYear() - yearOffset;
    const startKey = `${year}-01-01`;
    const endKeyRaw = `${year}-12-31`;
    const endKey = endKeyRaw > DateUtil.todayKey() ? DateUtil.todayKey() : endKeyRaw;

    body.appendChild(navRow(`${year}`, () => { yearOffset++; render(document.getElementById('screen-reports')); },
      yearOffset > 0 ? () => { yearOffset--; render(document.getElementById('screen-reports')); } : null));

    const trackers = await Trackers.listTrackers({ includeArchived: true });
    const rows = [];
    for (const t of trackers) {
      const entries = await Trackers.entriesInRange(t.id, startKey, endKey);
      if (entries.length === 0) continue;
      rows.push({ tracker: t, entries });
    }

    if (rows.length === 0) {
      body.appendChild(UI.el('div', { class: 'empty-state' }, [UI.el('h3', {}, 'No data for this year yet')]));
      return;
    }

    const daysLogged = DateUtil.daysBetween(startKey, endKey) + 1;
    body.appendChild(UI.el('div', { class: 'report-hero' }, [
      UI.el('div', { class: 'range' }, 'MY YEAR'),
      UI.el('div', { class: 'title' }, `${daysLogged} days of my life`),
    ]));

    const grid = UI.el('div', { class: 'year-stat-grid' });
    for (const r of rows) grid.appendChild(await yearStatCard(r.tracker, r.entries));
    body.appendChild(grid);

    // Biggest improvement / most consistent / most difficult (goal trackers)
    const goalRows = [];
    for (const r of rows) {
      if (r.tracker.goalDirection === 'none') continue;
      const cons = await Trackers.consistency(r.tracker, startKey, endKey);
      if (cons.expected > 0) goalRows.push({ ...r, cons });
    }
    if (goalRows.length) {
      const mostConsistent = goalRows.slice().sort((a, b) => b.cons.pct - a.cons.pct)[0];
      const mostDifficult = goalRows.slice().sort((a, b) => a.cons.pct - b.cons.pct)[0];
      body.appendChild(UI.el('h3', { class: 'section-title' }, 'The year in a few facts'));
      body.appendChild(UI.el('div', { class: 'callout good' }, `Most consistent habit: ${mostConsistent.tracker.name} (${mostConsistent.cons.pct}%).`));
      if (mostDifficult !== mostConsistent) body.appendChild(UI.el('div', { class: 'callout attention' }, `Most difficult habit: ${mostDifficult.tracker.name} (${mostDifficult.cons.pct}%).`));
    }

    // Numeric biggest improvement (first vs last value across the year)
    const numericImprovements = [];
    for (const r of rows) {
      if (!['number', 'duration', 'currency', 'count'].includes(r.tracker.type)) continue;
      const vals = r.entries.map((e) => Number(e.value)).filter((v) => !Number.isNaN(v));
      if (vals.length < 5) continue;
      numericImprovements.push({ tracker: r.tracker, change: vals[vals.length - 1] - vals[0], from: vals[0], to: vals[vals.length - 1] });
    }
    if (numericImprovements.length) {
      const biggest = numericImprovements.slice().sort((a, b) => Math.abs(b.change) - Math.abs(a.change))[0];
      body.appendChild(UI.el('div', { class: 'callout good' }, `Biggest change: ${biggest.tracker.name} moved from ${numFmt(biggest.from)} to ${numFmt(biggest.to)}${biggest.tracker.unit ? ` ${biggest.tracker.unit}` : ''}.`));
    }

    // Life events + experiments
    const events = (await DB.getAll('lifeEvents')).filter((ev) => overlaps(ev.startDate, ev.endDate || ev.startDate, startKey, endKey));
    const experiments = (await DB.getAll('experiments')).filter((ex) => overlaps(ex.startDate, ex.endDate, startKey, endKey));
    if (events.length) {
      body.appendChild(UI.el('h3', { class: 'section-title' }, 'Major life events'));
      events.forEach((ev) => body.appendChild(UI.el('div', { class: 'callout neutral' }, `${ev.name} — ${DateUtil.formatShort(ev.startDate)}${ev.endDate && ev.endDate !== ev.startDate ? ` to ${DateUtil.formatShort(ev.endDate)}` : ''}`)));
    }
    if (experiments.length) {
      body.appendChild(UI.el('h3', { class: 'section-title' }, 'Experiments completed'));
      experiments.forEach((ex) => body.appendChild(UI.el('div', { class: 'callout neutral' }, ex.title)));
    }

    // Trackers started / stopped this year
    const started = trackers.filter((t) => t.createdAt && DateUtil.toDateKey(new Date(t.createdAt)) >= startKey && DateUtil.toDateKey(new Date(t.createdAt)) <= endKey);
    const stopped = trackers.filter((t) => t.archivedAt && DateUtil.toDateKey(new Date(t.archivedAt)) >= startKey && DateUtil.toDateKey(new Date(t.archivedAt)) <= endKey);
    if (started.length || stopped.length) {
      body.appendChild(UI.el('h3', { class: 'section-title' }, 'What changed'));
      if (started.length) body.appendChild(UI.el('div', { class: 'callout neutral' }, `Started tracking: ${started.map((t) => t.name).join(', ')}.`));
      if (stopped.length) body.appendChild(UI.el('div', { class: 'callout neutral' }, `Stopped tracking: ${stopped.map((t) => t.name).join(', ')}.`));
    }

    body.appendChild(UI.el('h3', { class: 'section-title' }, 'Your year in review'));
    const summaryBits = [];
    if (numericImprovements.length) {
      const biggest = numericImprovements.slice().sort((a, b) => Math.abs(b.change) - Math.abs(a.change))[0];
      summaryBits.push(`${biggest.tracker.name.toLowerCase()} shifted from ${numFmt(biggest.from)} to ${numFmt(biggest.to)}${biggest.tracker.unit ? ` ${biggest.tracker.unit}` : ''}`);
    }
    if (goalRows.length) {
      const mostConsistent = goalRows.slice().sort((a, b) => b.cons.pct - a.cons.pct)[0];
      summaryBits.push(`${mostConsistent.tracker.name.toLowerCase()} was the habit you kept most consistently (${mostConsistent.cons.pct}%)`);
    }
    body.appendChild(UI.el('div', { class: 'callout good' }, summaryBits.length ? `Based on what you recorded, ${summaryBits.join(', and ')}.` : 'Keep logging through the year — this summary gets richer with more data.'));
  }

  async function yearStatCard(tracker, entries) {
    let valueStr = '';
    if (['number'].includes(tracker.type)) {
      const vals = entries.map((e) => Number(e.value)).filter((v) => !Number.isNaN(v));
      if (vals.length >= 2) valueStr = `${numFmt(vals[0])} → ${numFmt(vals[vals.length - 1])}${tracker.unit ? ` ${tracker.unit}` : ''}`;
      else valueStr = `${numFmt(vals[0])}${tracker.unit ? ` ${tracker.unit}` : ''}`;
    } else if (['duration', 'count', 'currency'].includes(tracker.type)) {
      const total = entries.reduce((a, e) => a + (Number(e.value) || 0), 0);
      valueStr = `${numFmt(total)}${tracker.unit ? ` ${tracker.unit}` : ''}`;
    } else if (tracker.type === 'time') {
      const mins = entries.map((e) => { const [h, m] = String(e.value).split(':').map(Number); return h * 60 + m; });
      const avg = mins.reduce((a, b) => a + b, 0) / mins.length;
      valueStr = `${String(Math.floor(avg / 60) % 24).padStart(2, '0')}:${String(Math.round(avg % 60)).padStart(2, '0')} avg`;
    } else if (tracker.type === 'rating') {
      const avg = entries.reduce((a, e) => a + Number(e.value), 0) / entries.length;
      valueStr = `${avg.toFixed(1)} avg`;
    } else if (tracker.type === 'yesno') {
      const yes = entries.filter((e) => e.value === true || e.value === 'true').length;
      valueStr = `${yes} days`;
    } else {
      valueStr = `${entries.length} entries`;
    }
    return UI.el('div', { class: 'year-stat' }, [
      UI.el('div', { class: 'icon' }, tracker.icon),
      UI.el('div', { class: 'value' }, valueStr),
      UI.el('div', { class: 'label' }, tracker.name),
    ]);
  }

  function navRow(label, onNext, onPrev) {
    return UI.el('div', { class: 'cal-month-nav' }, [
      UI.el('button', { onclick: onPrev, disabled: onPrev ? null : 'disabled', style: onPrev ? '' : 'visibility:hidden;' }, '‹'),
      UI.el('span', { class: 'label' }, label),
      UI.el('button', { onclick: onNext }, '›'),
    ]);
  }

  return { render };
})();

window.ReportsScreen = ReportsScreen;


/* ---- js/history.js ---- */
// ============================================================================
// history.js — calendar view of every date: entries, notes, life events,
// and Minimum Day status, with the ability to edit any past day.
// ============================================================================

const HistoryScreen = (() => {
  let cursor = new Date();

  async function render(root) {
    root.innerHTML = '';
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:4px;' }, 'History'));

    const monthStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const monthEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
    const startKey = DateUtil.toDateKey(monthStart);
    const endKey = DateUtil.toDateKey(monthEnd);

    root.appendChild(UI.el('div', { class: 'cal-month-nav' }, [
      UI.el('button', { onclick: () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1); render(root); } }, '‹'),
      UI.el('span', { class: 'label' }, DateUtil.formatMonthYear(startKey)),
      UI.el('button', { onclick: () => { cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1); render(root); } }, '›'),
    ]));

    const [entries, notes, events] = await Promise.all([
      allEntriesInRange(startKey, endKey),
      DB.getAll('dailyNotes'),
      DB.getAll('lifeEvents'),
    ]);
    const entryDates = new Set(entries.map((e) => e.date));
    const noteByDate = new Map(notes.map((n) => [n.date, n]));

    const grid = UI.el('div', { class: 'cal-grid' });
    ['S', 'M', 'T', 'W', 'T', 'F', 'S'].forEach((d) => grid.appendChild(UI.el('div', { class: 'cal-dow' }, d)));
    const firstDow = monthStart.getDay();
    for (let i = 0; i < firstDow; i++) grid.appendChild(UI.el('div', { class: 'cal-day empty' }));
    for (let d = 1; d <= monthEnd.getDate(); d++) {
      const key = DateUtil.toDateKey(new Date(cursor.getFullYear(), cursor.getMonth(), d));
      const hasData = entryDates.has(key) || noteByDate.has(key);
      const isMin = noteByDate.get(key)?.minimumDay?.active;
      const isToday = key === DateUtil.todayKey();
      grid.appendChild(UI.el('div', {
        class: `cal-day${hasData ? ' has-data' : ''}${isMin ? ' minimum' : ''}${isToday ? ' today' : ''}`,
        onclick: () => openDayDetail(key),
      }, String(d)));
    }
    root.appendChild(grid);

    // life events list for the visible month
    const monthEvents = events.filter((ev) => (ev.startDate <= endKey) && ((ev.endDate || ev.startDate) >= startKey));
    if (monthEvents.length) {
      root.appendChild(UI.el('h3', { class: 'section-title' }, 'Life events'));
      monthEvents.forEach((ev) => root.appendChild(UI.el('div', { class: 'list-row' }, [
        UI.el('span', { class: 'icon' }, '📌'),
        UI.el('div', { class: 'main' }, [
          UI.el('div', { class: 'name' }, ev.name),
          UI.el('div', { class: 'meta' }, `${DateUtil.formatShort(ev.startDate)}${ev.endDate && ev.endDate !== ev.startDate ? ` – ${DateUtil.formatShort(ev.endDate)}` : ''}${ev.note ? ` · ${ev.note}` : ''}`),
        ]),
      ])));
    }
  }

  async function allEntriesInRange(startKey, endKey) {
    const all = await DB.getAll('entries');
    return all.filter((e) => e.date >= startKey && e.date <= endKey);
  }

  async function openDayDetail(dateKey) {
    const [entries, note, trackers] = await Promise.all([
      Trackers.entriesForDate(dateKey),
      DB.get('dailyNotes', dateKey),
      Trackers.listTrackers({ includeArchived: true }),
    ]);
    const trackerById = new Map(trackers.map((t) => [t.id, t]));

    UI.openSheet((close) => {
      const wrap = UI.el('div', { class: 'stack' });
      if (note?.minimumDay?.active) {
        wrap.appendChild(UI.el('span', { class: 'badge-min' }, '🌤 Minimum Day'));
      }
      if (entries.length === 0) {
        wrap.appendChild(UI.el('p', { class: 'muted' }, 'No entries recorded for this day.'));
      }
      entries.forEach((e) => {
        const t = trackerById.get(e.trackerId);
        if (!t) return;
        wrap.appendChild(UI.el('div', { class: 'list-row' }, [
          UI.el('span', { class: 'icon' }, t.icon),
          UI.el('div', { class: 'main' }, [
            UI.el('div', { class: 'name' }, t.name),
            UI.el('div', { class: 'meta' }, UI.formatValueForDisplay(t, e.value)),
          ]),
          UI.el('button', { class: 'action', onclick: () => { close(); openEditEntry(t, dateKey); } }, 'Edit'),
        ]));
      });
      if (note?.note || note?.mood || note?.goodThing) {
        wrap.appendChild(UI.el('div', { class: 'trend-card' }, [
          note?.mood ? UI.el('p', { class: 'small' }, `Mood: ${note.mood}/5`) : null,
          note?.energy ? UI.el('p', { class: 'small' }, `Energy: ${note.energy}/5`) : null,
          note?.note ? UI.el('p', { class: 'small', style: 'margin-top:6px;' }, note.note) : null,
          note?.goodThing ? UI.el('p', { class: 'small', style: 'margin-top:6px; font-style:italic;' }, `“${note.goodThing}”`) : null,
        ]));
      }
      wrap.appendChild(UI.el('button', { class: 'btn btn-ghost btn-block', onclick: () => {
        close();
        TodayScreen.setViewDate(dateKey);
        App.go('today');
      } }, 'Open this day on Today'));
      return wrap;
    }, { title: DateUtil.formatFriendly(dateKey) });

  function openEditEntry(tracker, dateKey) {

/* ---- js/backup.js ---- */
// ============================================================================
// backup.js — export/import a full JSON backup, export CSV, and wipe data.
// This is the app's safety net since everything else lives only in the
// browser's IndexedDB.
// ============================================================================

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function exportBackup() {
  const data = await DB.exportAll();
  const stamp = DateUtil.todayKey();
  downloadBlob(JSON.stringify(data, null, 2), `life-dashboard-backup-${stamp}.json`, 'application/json');
  UI.toast('Backup exported');
}

async function importBackup(file) {
  const text = await file.text();
  let data;
  try { data = JSON.parse(text); } catch { throw new Error('That file isn\u2019t valid JSON'); }
  if (!data._meta || data._meta.app !== 'life-dashboard') {
    const ok = await UI.confirmDialog({ title: 'Unrecognized backup', message: 'This file doesn\u2019t look like a Life Dashboard backup. Try to import it anyway?', confirmLabel: 'Import anyway', danger: true });
    if (!ok) return false;
  }
  await DB.importAll(data);
  return true;
}

function csvEscape(v) {
  const s = String(v ?? '');
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

async function exportCSV() {
  const [trackers, entries] = await Promise.all([DB.getAll('trackers'), DB.getAll('entries')]);
  const trackerById = new Map(trackers.map((t) => [t.id, t]));
  const rows = [['date', 'tracker', 'category', 'type', 'value', 'unit', 'note']];
  entries
    .slice()
    .sort((a, b) => (a.date < b.date ? -1 : 1))
    .forEach((e) => {
      const t = trackerById.get(e.trackerId);
      if (!t) return;
      rows.push([e.date, t.name, t.category, t.type, e.value, t.unit || '', e.note || '']);
    });
  const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\n');
  downloadBlob(csv, `life-dashboard-export-${DateUtil.todayKey()}.csv`, 'text/csv');
  UI.toast('CSV exported');
}

async function clearAllData() {
  await DB.clearAll();
}

window.Backup = { exportBackup, importBackup, exportCSV, clearAllData };

// ============================================================================
// sampledata.js — "Explore with sample data": ~30 days of realistic made-up
// entries so a new user can see Today, Trends and Reports working before
// they've logged anything themselves. Fully removable.
// ============================================================================

const SampleData = (() => {
  function rand(min, max) { return min + Math.random() * (max - min); }
  function round1(n) { return Math.round(n * 10) / 10; }

  async function populate() {
    const days = 30;
    const trackerDefs = [
      { name: 'Weight', icon: '⚖️', category: 'health', type: 'number', unit: 'kg', goal: 78, goalDirection: 'atleast', gen: (i) => round1(84 - (i / days) * 4 + rand(-0.3, 0.3)) },
      { name: 'Walking', icon: '🚶', category: 'fitness', type: 'number', unit: 'km', goal: 2.5, goalDirection: 'atleast', gen: () => round1(rand(1, 4.5)) },
      { name: 'Water', icon: '💧', category: 'health', type: 'number', unit: 'L', goal: 2.5, goalDirection: 'atleast', gen: () => round1(rand(1.2, 3.1)) },
      { name: 'Wake-up', icon: '⏰', category: 'sleep', type: 'time', goal: '05:30', goalDirection: 'before', gen: () => `${String(Math.floor(rand(5, 7))).padStart(2, '0')}:${String(Math.floor(rand(0, 59))).padStart(2, '0')}` },
      { name: 'Reading', icon: '📖', category: 'learning', type: 'duration', unit: 'minutes', goal: 20, goalDirection: 'atleast', gen: () => Math.round(rand(0, 45)) },
      { name: 'Mood', icon: '😊', category: 'wellbeing', type: 'rating', goalDirection: 'none', gen: () => Math.round(rand(2, 5)) },
      { name: 'Exercise', icon: '🏃', category: 'fitness', type: 'yesno', goalDirection: 'none', gen: () => Math.random() > 0.4 },
      { name: 'Spending', icon: '💰', category: 'money', type: 'currency', unit: '₹', goal: 800, goalDirection: 'atmost', gen: () => Math.round(rand(150, 1400)) },
    ];

    const sampleTrackerIds = [];
    const trackers = [];
    for (const def of trackerDefs) {
      const t = Trackers.newTracker({
        name: def.name, icon: def.icon, category: def.category, type: def.type,
        unit: def.unit || '', goal: def.goal ?? null, goalDirection: def.goalDirection,
        createdAt: new Date(Date.now() - days * 86400000).toISOString(),
      });
      await Trackers.saveTracker(t);
      sampleTrackerIds.push(t.id);
      trackers.push({ t, def });
    }

    const today = DateUtil.todayKey();
    for (let i = days; i >= 1; i--) {
      const dateKey = DateUtil.addDays(today, -i);
      const isTravel = i >= 18 && i <= 15; // placeholder, replaced below
      for (const { t, def } of trackers) {
        // Skip some days randomly so it looks like real logging, not perfect
        if (Math.random() < 0.12) continue;
        const value = def.gen(days - i);
        await Trackers.setEntry(t.id, dateKey, value);
      }
      if (Math.random() < 0.3) {
        await DB.put('dailyNotes', {
          date: dateKey,
          mood: Math.round(rand(2, 5)),
          energy: Math.round(rand(2, 5)),
          goodThing: ['A good walk outside', 'Finished a chapter', 'Quiet evening at home', 'Caught up with a friend'][Math.floor(rand(0, 4))],
        });
      }
    }

    // one life event: a short travel period ~10 days ago
    const travelStart = DateUtil.addDays(today, -12);
    const travelEnd = DateUtil.addDays(today, -9);
    await DB.put('lifeEvents', {
      id: DB.uid(), name: 'Travel', startDate: travelStart, endDate: travelEnd,
      note: 'Short trip — routine was looser than usual', createdAt: new Date().toISOString(),
    });

    await Settings.set('sampleTrackerIds', sampleTrackerIds);
  }

  async function remove() {
    const ids = await Settings.get('sampleTrackerIds', []);
    for (const id of ids) await Trackers.deleteTrackerAndEntries(id);
    const events = await DB.getAll('lifeEvents');
    for (const ev of events) if (ev.name === 'Travel') await DB.delete('lifeEvents', ev.id);
    await Settings.set('sampleTrackerIds', []);
    await Settings.set('sampleDataActive', false);
  }

  return { populate, remove };
})();

// ============================================================================
// experiments.js — time-boxed personal experiments: pick related trackers,
// run for N days, then compare before / during / after. No causal claims.
// ============================================================================

const Experiments = (() => {
  function newExperiment(overrides = {}) {
    return {
      id: DB.uid(), title: '', startDate: DateUtil.todayKey(), endDate: DateUtil.addDays(DateUtil.todayKey(), 29),
      trackerIds: [], createdAt: new Date().toISOString(), ...overrides,
    };
  }

  async function list() { return (await DB.getAll('experiments')).sort((a, b) => (a.startDate < b.startDate ? 1 : -1)); }
  async function save(exp) { return DB.put('experiments', exp); }
  async function remove(id) { return DB.delete('experiments', id); }

  function openCreateSheet(onSaved) {
    const exp = newExperiment();
    UI.openSheet((close) => {
      const wrap = UI.el('div', { class: 'stack' });
      wrap.appendChild(UI.el('div', { class: 'field' }, [
        UI.el('label', {}, 'Experiment'),
        UI.el('input', { type: 'text', placeholder: 'e.g. No food after 7 PM', oninput: (e) => { exp.title = e.target.value; } }),
      ]));
      wrap.appendChild(UI.el('div', { class: 'field-row' }, [
        UI.el('div', { class: 'field' }, [UI.el('label', {}, 'Start date'), UI.el('input', { type: 'date', value: exp.startDate, onchange: (e) => { exp.startDate = e.target.value; } })]),
        UI.el('div', { class: 'field' }, [UI.el('label', {}, 'End date'), UI.el('input', { type: 'date', value: exp.endDate, onchange: (e) => { exp.endDate = e.target.value; } })]),
      ]));

      const trackerListHost = UI.el('div', { class: 'field' }, [UI.el('label', {}, 'Related trackers')]);
      Trackers.listTrackers().then((trackers) => {
        const grid = UI.el('div', { class: 'chip-grid' });
        trackers.forEach((t) => {
          const chip = UI.el('div', { class: 'chip', onclick: () => {
            if (exp.trackerIds.includes(t.id)) { exp.trackerIds = exp.trackerIds.filter((id) => id !== t.id); chip.classList.remove('active'); }
            else { exp.trackerIds.push(t.id); chip.classList.add('active'); }
          } }, `${t.icon} ${t.name}`);
          grid.appendChild(chip);
        });
        trackerListHost.appendChild(grid);
      });
      wrap.appendChild(trackerListHost);

      wrap.appendChild(UI.el('button', { class: 'btn btn-primary btn-block', style: 'margin-top:10px;', onclick: async () => {
        if (!exp.title.trim()) { UI.toast('Give the experiment a name'); return; }
        await save(exp);
        close();
        UI.toast('Experiment started');
        onSaved && onSaved();
      } }, 'Start experiment'));

      return wrap;
    }, { title: 'Start Experiment' });
  }

  async function openReportSheet(exp) {
    const beforeStart = DateUtil.addDays(exp.startDate, -DateUtil.daysBetween(exp.startDate, exp.endDate) - 1);
    const beforeEnd = DateUtil.addDays(exp.startDate, -1);
    const today = DateUtil.todayKey();
    const afterStart = DateUtil.addDays(exp.endDate, 1);
    const hasAfter = today > exp.endDate;

    const trackers = await Promise.all(exp.trackerIds.map((id) => Trackers.getTracker(id)));

    UI.openSheet((close) => {
      const wrap = UI.el('div', { class: 'stack' });
      wrap.appendChild(UI.el('p', { class: 'small muted' }, `${DateUtil.formatShort(exp.startDate)} – ${DateUtil.formatShort(exp.endDate)}. During this period, your recorded data shows the following. This does not establish that one caused the other.`));

      (async () => {
        for (const t of trackers) {
          if (!t) continue;
          const beforeEntries = await Trackers.entriesInRange(t.id, beforeStart, beforeEnd);
          const duringEntries = await Trackers.entriesInRange(t.id, exp.startDate, today < exp.endDate ? today : exp.endDate);
          const afterEntries = hasAfter ? await Trackers.entriesInRange(t.id, afterStart, DateUtil.addDays(exp.endDate, DateUtil.daysBetween(exp.startDate, exp.endDate) + 1)) : [];

          const avg = (entries) => {
            if (t.type === 'time') {
              const mins = entries.map((e) => { const [h, m] = String(e.value).split(':').map(Number); return h * 60 + m; });
              if (!mins.length) return null;
              const a = mins.reduce((x, y) => x + y, 0) / mins.length;
              return `${String(Math.floor(a / 60) % 24).padStart(2, '0')}:${String(Math.round(a % 60)).padStart(2, '0')}`;
            }
            if (t.type === 'yesno') {
              if (!entries.length) return null;
              return `${entries.filter((e) => e.value === true || e.value === 'true').length}/${entries.length} days`;
            }
            const nums = entries.map((e) => Number(e.value)).filter((v) => !Number.isNaN(v));
            if (!nums.length) return null;
            return Math.round((nums.reduce((x, y) => x + y, 0) / nums.length) * 100) / 100;
          };

          const b = avg(beforeEntries), d = avg(duringEntries), a = hasAfter ? avg(afterEntries) : null;
          const card = UI.el('div', { class: 'trend-card' });
          card.appendChild(UI.el('div', { class: 'head' }, [UI.el('span', { class: 'icon' }, t.icon), UI.el('span', { class: 'name' }, t.name)]));
          card.appendChild(UI.el('div', { class: 'metric-row' }, [UI.el('span', { class: 'small muted' }, 'Before'), UI.el('span', { class: 'small' }, b === null ? 'Insufficient data' : String(b))]));
          card.appendChild(UI.el('div', { class: 'metric-row' }, [UI.el('span', { class: 'small muted' }, 'During'), UI.el('span', { class: 'small' }, d === null ? 'Insufficient data' : String(d))]));
          if (hasAfter) card.appendChild(UI.el('div', { class: 'metric-row' }, [UI.el('span', { class: 'small muted' }, 'After'), UI.el('span', { class: 'small' }, a === null ? 'Insufficient data' : String(a))]));
          wrap.appendChild(card);
        }
      })();

      wrap.appendChild(UI.el('button', { class: 'btn btn-ghost btn-block', onclick: async () => {
        const ok = await UI.confirmDialog({ title: 'Delete this experiment?', message: 'This removes the experiment record but keeps all tracker data.', confirmLabel: 'Delete', danger: true });
        if (ok) { await remove(exp.id); close(); UI.toast('Experiment deleted'); MeScreen.refresh(); }
      } }, 'Delete experiment'));

      return wrap;
    }, { title: exp.title });
  }

  return { list, save, remove, newExperiment, openCreateSheet, openReportSheet };
})();

window.Experiments = Experiments;

// ============================================================================
// me.js — the "Me" tab: My Trackers, Goals, Experiments, History,
// Appearance, Backup & Restore, and Settings.
// ============================================================================

const MeScreen = (() => {
  let sub = 'menu';
  let lastRoot = null;

  async function render(root) {
    lastRoot = root;
    root.innerHTML = '';
    if (sub !== 'menu') {
      root.appendChild(UI.el('button', { class: 'btn-link', style: 'margin-bottom:6px;', onclick: () => { sub = 'menu'; render(root); } }, '‹ Back'));
    }
    if (sub === 'menu') await renderMenu(root);
    else if (sub === 'trackers') await renderTrackers(root);
    else if (sub === 'goals') await renderGoals(root);
    else if (sub === 'experiments') await renderExperiments(root);
    else if (sub === 'history') await HistoryScreen.render(root);
    else if (sub === 'appearance') await renderAppearance(root);
    else if (sub === 'backup') await renderBackup(root);
    else if (sub === 'settings') await renderSettings(root);
  }

  function refresh() { if (lastRoot) render(lastRoot); }

  async function renderMenu(root) {
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:4px;' }, 'Me'));
    const items = [
      ['trackers', '📋', 'My Trackers', 'Add, edit, reorder and archive'],
      ['goals', '🎯', 'Goals', 'Every tracker with a target'],
      ['experiments', '🧪', 'Experiments', 'Time-boxed self-tests'],
      ['history', '📅', 'History', 'Browse and edit any past day'],
      ['appearance', '🎨', 'Appearance', 'Light, dark, or automatic'],
      ['backup', '💾', 'Backup & Restore', 'Export, import, or clear your data'],
      ['settings', '⚙️', 'Settings', 'Privacy and app info'],
    ];
    const list = UI.el('div', {});
    items.forEach(([key, icon, name, meta]) => {
      list.appendChild(UI.el('div', { class: 'list-row', style: 'cursor:pointer;', onclick: () => { sub = key; render(root); } }, [
        UI.el('span', { class: 'icon' }, icon),
        UI.el('div', { class: 'main' }, [UI.el('div', { class: 'name' }, name), UI.el('div', { class: 'meta' }, meta)]),
        UI.el('span', { class: 'muted' }, '›'),
      ]));
    });
    root.appendChild(list);
  }

  // -- My Trackers -----------------------------------------------------------

  async function renderTrackers(root) {
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:0;' }, 'My Trackers'));
    root.appendChild(UI.el('button', { class: 'btn btn-primary btn-block', style: 'margin-bottom:14px;', onclick: () => TrackerEditor.open(null, () => render(root)) }, '+ Add tracker'));

    const active = await Trackers.listTrackers();
    const archived = await Trackers.listTrackers({ includeArchived: true }).then((all) => all.filter((t) => t.archivedAt));

    root.appendChild(UI.el('h3', { class: 'section-title' }, `Active (${active.length})`));
    if (active.length === 0) root.appendChild(UI.el('p', { class: 'muted small' }, 'No active trackers.'));
    active.forEach((t, i) => root.appendChild(trackerRow(t, i, active.length, root)));

    if (archived.length) {
      root.appendChild(UI.el('h3', { class: 'section-title' }, `Archived (${archived.length})`));
      archived.forEach((t) => root.appendChild(archivedRow(t, root)));
    }
  }

  function trackerRow(t, index, total, root) {
    return UI.el('div', { class: 'list-row' }, [
      UI.el('span', { class: 'icon' }, t.icon),
      UI.el('div', { class: 'main', style: 'cursor:pointer;', onclick: () => TrackerEditor.open(t, () => render(root)) }, [
        UI.el('div', { class: 'name' }, t.name),
        UI.el('div', { class: 'meta' }, `${Trackers.TRACKER_TYPES[t.type].label} · ${Trackers.CATEGORY_LABELS[t.category]}`),
      ]),
      UI.el('button', { class: 'action', disabled: index === 0 ? 'disabled' : null, onclick: async () => { await reorder(t, -1); render(root); } }, '↑'),
      UI.el('button', { class: 'action', disabled: index === total - 1 ? 'disabled' : null, onclick: async () => { await reorder(t, 1); render(root); } }, '↓'),
    ]);
  }

  async function reorder(tracker, dir) {
    const all = await Trackers.listTrackers();
    const idx = all.findIndex((t) => t.id === tracker.id);
    const swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= all.length) return;
    const a = all[idx], b = all[swapIdx];
    const tmp = a.order; a.order = b.order; b.order = tmp;
    await Trackers.saveTracker(a);
    await Trackers.saveTracker(b);
  }

  function archivedRow(t, root) {
    return UI.el('div', { class: 'list-row archived' }, [
      UI.el('span', { class: 'icon' }, t.icon),
      UI.el('div', { class: 'main' }, [UI.el('div', { class: 'name' }, t.name), UI.el('div', { class: 'meta' }, 'Archived')]),
      UI.el('button', { class: 'action', onclick: async () => { await Trackers.restoreTracker(t.id); UI.toast('Restored'); render(root); } }, 'Restore'),
      UI.el('button', { class: 'action', style: 'color:var(--danger);', onclick: async () => {
        const ok = await UI.confirmDialog({ title: 'Delete permanently?', message: `This removes "${t.name}" and all of its history for good.`, confirmLabel: 'Delete', danger: true });
        if (ok) { await Trackers.deleteTrackerAndEntries(t.id); UI.toast('Deleted'); render(root); }
      } }, 'Delete'),
    ]);
  }

  // -- Goals -------------------------------------------------------------------

  async function renderGoals(root) {
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:0;' }, 'Goals'));
    const trackers = (await Trackers.listTrackers()).filter((t) => t.goalDirection && t.goalDirection !== 'none');
    if (trackers.length === 0) {
      root.appendChild(UI.el('div', { class: 'empty-state' }, [UI.el('h3', {}, 'No goals set'), UI.el('p', {}, 'Open a tracker and set a target to see it here.')]));
      return;
    }
    trackers.forEach((t) => {
      root.appendChild(UI.el('div', { class: 'list-row', style: 'cursor:pointer;', onclick: () => TrackerEditor.open(t, () => render(root)) }, [
        UI.el('span', { class: 'icon' }, t.icon),
        UI.el('div', { class: 'main' }, [UI.el('div', { class: 'name' }, t.name), UI.el('div', { class: 'meta' }, Trackers.goalLabel(t))]),
        UI.el('span', { class: 'muted' }, '›'),
      ]));
    });
  }

  // -- Experiments ---------------------------------------------------------------

  async function renderExperiments(root) {
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:0;' }, 'Experiments'));
    root.appendChild(UI.el('button', { class: 'btn btn-primary btn-block', style: 'margin-bottom:14px;', onclick: () => Experiments.openCreateSheet(() => render(root)) }, '+ Start experiment'));
    const list = await Experiments.list();
    if (list.length === 0) {
      root.appendChild(UI.el('p', { class: 'muted small' }, 'No experiments yet.'));
      return;
    }
    const today = DateUtil.todayKey();
    list.forEach((exp) => {
      const totalDays = DateUtil.daysBetween(exp.startDate, exp.endDate) + 1;
      const dayNum = Math.min(totalDays, Math.max(1, DateUtil.daysBetween(exp.startDate, today) + 1));
      const isActive = today >= exp.startDate && today <= exp.endDate;
      const isDone = today > exp.endDate;
      root.appendChild(UI.el('div', { class: 'list-row', style: 'cursor:pointer;', onclick: () => Experiments.openReportSheet(exp) }, [
        UI.el('span', { class: 'icon' }, '🧪'),
        UI.el('div', { class: 'main' }, [
          UI.el('div', { class: 'name' }, exp.title),
          UI.el('div', { class: 'meta' }, isActive ? `Day ${dayNum} / ${totalDays}` : isDone ? 'Completed — view report' : 'Upcoming'),
        ]),
        UI.el('span', { class: 'muted' }, '›'),
      ]));
    });
  }

  // -- Appearance ---------------------------------------------------------------

  async function renderAppearance(root) {
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:0;' }, 'Appearance'));
    const current = await Settings.get('theme', 'auto');
    const row = UI.el('div', { class: 'theme-row' });
    [['auto', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']].forEach(([key, label]) => {
      row.appendChild(UI.el('button', { class: current === key ? 'active' : '', onclick: async () => { await Settings.set('theme', key); await Settings.applyTheme(); render(root); } }, label));
    });
    root.appendChild(row);
  }

  // -- Backup ---------------------------------------------------------------

  async function renderBackup(root) {
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:0;' }, 'Backup & Restore'));
    root.appendChild(UI.el('p', { class: 'muted small', style: 'margin-bottom:16px;' }, 'Your life data stays on this device unless you export it. There is no account, no server, and no analytics.'));

    const sampleActive = await Settings.get('sampleDataActive', false);
    if (sampleActive) {
      root.appendChild(UI.el('div', { class: 'callout attention', style: 'margin-bottom:16px;' }, [
        UI.el('h4', {}, 'Sample data is active'),
        UI.el('p', {}, 'You\u2019re exploring the app with made-up data.'),
        UI.el('button', { class: 'btn btn-danger', style: 'margin-top:10px;', onclick: async () => {
          const ok = await UI.confirmDialog({ title: 'Delete sample data?', message: 'This removes all the sample trackers and entries so you can start logging your real life.', confirmLabel: 'Delete sample data', danger: true });
          if (ok) { await SampleData.remove(); UI.toast('Sample data removed'); render(root); }
        } }, 'Delete sample data and start my life'),
      ]));
    }

    const group = UI.el('div', { class: 'settings-group' }, [
      UI.el('h4', {}, 'Data'),
      settingsAction('Export backup', 'A JSON file with everything — trackers, entries, notes, events', 'Export', Backup.exportBackup),
      settingsAction('Import backup', 'Restore from a previously exported JSON file', 'Choose file', null, true),
      settingsAction('Export CSV', 'Human-readable spreadsheet of all entries', 'Export', Backup.exportCSV),
      settingsAction('Clear all data', 'Permanently erase everything on this device', 'Clear', async () => {
        const ok = await UI.confirmDialog({ title: 'Clear all data?', message: 'This permanently deletes every tracker, entry, note and event on this device. This cannot be undone.', confirmLabel: 'Clear everything', danger: true });
        if (ok) {
          const ok2 = await UI.confirmDialog({ title: 'Are you absolutely sure?', message: 'Consider exporting a backup first. There is no way to recover this data afterward.', confirmLabel: 'Yes, delete everything', danger: true });
          if (ok2) { await Backup.clearAllData(); UI.toast('All data cleared'); App.start(); }
        }
      }, false, true),
    ]);
    root.appendChild(group);
  }

  function settingsAction(name, desc, actionLabel, handler, isFileImport = false, danger = false) {
    if (isFileImport) {
      const inputId = `import-file-${Math.random().toString(36).slice(2)}`;
      const fileInput = UI.el('input', { type: 'file', id: inputId, accept: 'application/json', style: 'display:none;', onchange: async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const ok = await UI.confirmDialog({ title: 'Import backup?', message: 'This replaces all current data on this device with the contents of the backup file.', confirmLabel: 'Import', danger: true });
        if (!ok) { e.target.value = ''; return; }
        try {
          await Backup.importBackup(file);
          UI.toast('Backup imported');
          App.start();
        } catch (err) {
          UI.toast(err.message || 'Import failed');
        }
      } });
      return UI.el('div', { class: 'settings-item' }, [
        UI.el('div', {}, [UI.el('div', { class: 'name' }, name), UI.el('div', { class: 'desc' }, desc)]),
        UI.el('label', { class: 'btn btn-ghost', for: inputId, style: 'margin:0;' }, [actionLabel, fileInput]),
      ]);
    }
    return UI.el('div', { class: 'settings-item' }, [
      UI.el('div', {}, [UI.el('div', { class: 'name' }, name), UI.el('div', { class: 'desc' }, desc)]),
      UI.el('button', { class: danger ? 'btn btn-danger' : 'btn btn-ghost', onclick: handler }, actionLabel),
    ]);
  }

  // -- Settings ---------------------------------------------------------------

  async function renderSettings(root) {
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:0;' }, 'Settings'));
    root.appendChild(UI.el('div', { class: 'callout neutral' }, [
      UI.el('h4', {}, 'Privacy'),
      UI.el('p', {}, 'Your life data stays on this device unless you export it. No analytics, no account, no server upload, no external tracking.'),
    ]));
    root.appendChild(UI.el('div', { class: 'settings-group' }, [
      UI.el('h4', {}, 'About'),
      UI.el('div', { class: 'settings-item' }, [UI.el('div', { class: 'name' }, 'Life Dashboard'), UI.el('div', { class: 'muted small' }, 'v1.0')]),
    ]));
  }

  return { render, refresh, goTo: (key) => { sub = key; } };
})();

window.MeScreen = MeScreen;


/* ---- js/app.js ---- */
// ============================================================================
// app.js — bootstraps the app: onboarding check, bottom navigation, screen
// router, and the central "+" quick-add menu.
// ============================================================================

const App = (() => {
  const SCREENS = [
    { key: 'today', label: 'Today', icon: '🏠', render: (root) => TodayScreen.render(root) },
    { key: 'trends', label: 'Trends', icon: '📈', render: (root) => TrendsScreen.render(root) },
    { key: 'reports', label: 'Reports', icon: '📊', render: (root) => ReportsScreen.render(root) },
    { key: 'me', label: 'Me', icon: '🙂', render: (root) => MeScreen.render(root) },
  ];
  let current = 'today';

  function go(key) {
    current = key;
    renderShell();
  }

  function renderShell() {
    const appRoot = document.getElementById('app');
    appRoot.innerHTML = '';

    SCREENS.forEach((s) => {
      const screenDiv = document.createElement('div');
      screenDiv.className = `screen${s.key === current ? ' active' : ''}`;
      screenDiv.id = `screen-${s.key}`;
      appRoot.appendChild(screenDiv);
      if (s.key === current) s.render(screenDiv);
    });

    appRoot.appendChild(renderNav());
  }

  function renderNav() {
    const nav = UI.el('nav', { class: 'bottom-nav' });
    const order = ['today', 'trends', '__add__', 'reports', 'me'];
    order.forEach((key) => {
      if (key === '__add__') {
        nav.appendChild(UI.el('button', { class: 'nav-add', 'aria-label': 'Quick add', onclick: openQuickAdd }, '+'));
        return;
      }
      const s = SCREENS.find((x) => x.key === key);
      nav.appendChild(UI.el('button', { class: `nav-btn${current === key ? ' active' : ''}`, onclick: () => go(key) }, [
        UI.el('span', { class: 'nav-icon' }, s.icon),
        UI.el('span', {}, s.label),
      ]));
    });
    return nav;
  }

  function openQuickAdd() {
    UI.openSheet((close) => {
      const wrap = UI.el('div', { class: 'stack' });
      const actions = [
        ['📋', 'Add Tracker', () => { close(); TrackerEditor.open(null, () => go(current)); }],
        ['📝', 'Add Note', () => { close(); go('today'); }],
        ['📌', 'Add Life Event', () => { close(); LifeEvents.openAddSheet(() => { if (current === 'reports' || current === 'me') go(current); }); }],
        ['🧪', 'Start Experiment', () => { close(); Experiments.openCreateSheet(() => { if (current === 'me') go(current); }); }],
      ];
      actions.forEach(([icon, label, handler]) => {
        wrap.appendChild(UI.el('div', { class: 'list-row', style: 'cursor:pointer;', onclick: handler }, [
          UI.el('span', { class: 'icon' }, icon),
          UI.el('div', { class: 'main' }, [UI.el('div', { class: 'name' }, label)]),
        ]));
      });
      return wrap;
    }, { title: 'Quick add' });
  }

  async function start() {
    await Settings.applyTheme();
    const onboarded = await Settings.get('onboarded', false);
    const appRoot = document.getElementById('app');
    if (!onboarded) {
      Onboarding.render(appRoot);
      return;
    }
    current = 'today';
    renderShell();
  }

  return { start, go };
})();

window.App = App;

document.addEventListener('DOMContentLoaded', () => {
  App.start();
  // This single-file build has no separate sw.js to register (everything lives
  // in this one HTML file already, so there is nothing extra to cache).
});

</script>

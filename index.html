<style>
/* ============================================================================
   Life Dashboard — styles
   Design language: a calm, personal journal rather than a SaaS dashboard.
   Serif for headings/reflective content, system sans for data and UI chrome.
   One accent (sage) reserved for goals reached / primary actions.
   ============================================================================ */

:root {
  /* Color — warm stone paper, ink text, sage accent, muted clay for alerts */
  --bg: #F1EFE9;
  --surface: #FBFAF7;
  --surface-raised: #FFFFFF;
  --ink: #262622;
  --ink-soft: #4B4A44;
  --text-muted: #83807A;
  --border: #E1DDD3;
  --accent: #4F7A5C;
  --accent-strong: #3C5F47;
  --accent-soft: #A9C4AE;
  --accent-wash: #E7EFE7;
  --clay: #B0714A;
  --clay-wash: #F3E8DE;
  --danger: #B1493F;
  --danger-wash: #F5E4E1;

  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --shadow-card: 0 1px 2px rgba(38, 38, 34, 0.05);
  --font-serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --nav-h: 62px;
}

[data-theme="dark"] {
  --bg: #1C1E19;
  --surface: #242621;
  --surface-raised: #2B2D27;
  --ink: #EDEAE2;
  --ink-soft: #C9C5BB;
  --text-muted: #8D8A81;
  --border: #383A33;
  --accent: #7EA98A;
  --accent-strong: #9BC4A6;
  --accent-soft: #4F6B57;
  --accent-wash: #263229;
  --clay: #D3936B;
  --clay-wash: #33291F;
  --danger: #DE8478;
  --danger-wash: #3A2622;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1E19;
    --surface: #242621;
    --surface-raised: #2B2D27;
    --ink: #EDEAE2;
    --ink-soft: #C9C5BB;
    --text-muted: #8D8A81;
    --border: #383A33;
    --accent: #7EA98A;
    --accent-strong: #9BC4A6;
    --accent-soft: #4F6B57;
    --accent-wash: #263229;
    --clay: #D3936B;
    --clay-wash: #33291F;
    --danger: #DE8478;
    --danger-wash: #3A2622;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--font-serif); font-weight: 600; margin: 0; color: var(--ink); }
p { margin: 0; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; position: relative; padding-bottom: calc(var(--nav-h) + 18px); }

.screen { display: none; padding: 18px 18px 8px; animation: fadein .18s ease; }
.screen.active { display: block; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* ---- Top header ---- */
.top-header { padding: 6px 2px 14px; }
.top-header .dow { font-size: 13px; color: var(--text-muted); text-transform: none; letter-spacing: .2px; }
.top-header .date { font-family: var(--font-serif); font-size: 26px; margin-top: 2px; }
.top-header .greeting { color: var(--ink-soft); margin-top: 4px; font-size: 14.5px; }

.section-title { font-family: var(--font-serif); font-size: 19px; margin: 22px 0 10px; }
.section-title:first-child { margin-top: 0; }

/* ---- Progress line ---- */
.progress-line { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--accent-wash); border-radius: var(--radius-m); margin-bottom: 16px; }
.progress-line .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.progress-line span { font-size: 13.5px; color: var(--accent-strong); }

/* ---- Tracker cards (Today) ---- */
.tracker-list { display: flex; flex-direction: column; gap: 10px; }
.tracker-card {
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border);
  border-radius: var(--radius-m);
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.tracker-card.reached { border-left-color: var(--accent); }
.tracker-card .icon { font-size: 21px; flex: none; width: 30px; text-align: center; }
.tracker-card .main { flex: 1; min-width: 0; }
.tracker-card .name-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.tracker-card .name { font-weight: 600; font-size: 14.5px; }
.tracker-card .goal-check { font-size: 12px; color: var(--accent-strong); white-space: nowrap; }
.tracker-card .goal-text { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.tracker-card .input-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }

.stepper-btn {
  width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer;
}
.stepper-btn:active { background: var(--accent-wash); }

.value-input {
  border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--surface);
  color: var(--ink); padding: 7px 9px; font-size: 14.5px; width: 100%; max-width: 130px;
}
.value-input:focus { border-color: var(--accent); }
.value-input.wide { max-width: none; }

.pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer;
}
.pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.yesno-toggle { display: flex; gap: 6px; }
.yesno-toggle button { flex: 1; padding: 7px 0; border-radius: var(--radius-s); border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); cursor: pointer; }
.yesno-toggle button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

.empty-state { text-align: center; padding: 46px 18px; color: var(--text-muted); }
.empty-state h3 { color: var(--ink); margin-bottom: 6px; font-size: 17px; }
.empty-state p { font-size: 13.5px; margin-bottom: 16px; }

/* ---- Buttons ---- */
.btn { border-radius: var(--radius-s); padding: 10px 16px; font-size: 14.5px; font-weight: 600; border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:active { background: var(--accent-strong); }
.btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--border); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-block { width: 100%; display: block; text-align: center; }
.btn-link { background: none; border: none; color: var(--accent-strong); font-weight: 600; cursor: pointer; padding: 8px 0; font-size: 14px; }

/* ---- Bottom nav ---- */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; height: var(--nav-h);
  max-width: 560px; margin: 0 auto;
  background: var(--surface-raised); border-top: 1px solid var(--border);
  display: flex; align-items: stretch; z-index: 40;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-muted); font-size: 11px; cursor: pointer; }
.nav-btn .nav-icon { font-size: 19px; }
.nav-btn.active { color: var(--accent-strong); }
.nav-add {
  flex: none; width: 54px; height: 54px; margin-top: -20px; border-radius: 50%;
  background: var(--accent); color: #fff; font-size: 26px; border: 4px solid var(--bg);
  display: flex; align-items: center; justify-content: center; align-self: center; cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
}

/* ---- Overlays / dialogs / sheets ---- */
.overlay { position: fixed; inset: 0; background: rgba(20,20,16,0.42); z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.dialog { background: var(--surface-raised); border-radius: var(--radius-l); padding: 22px; margin: auto; max-width: 380px; width: calc(100% - 40px); }
.dialog h3 { font-size: 18px; margin-bottom: 8px; }
.dialog p { color: var(--ink-soft); font-size: 14px; }
.dialog-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

.sheet {
  background: var(--surface-raised); width: 100%; max-width: 560px; max-height: 86vh;
  border-radius: var(--radius-l) var(--radius-l) 0 0; display: flex; flex-direction: column;
  transform: translateY(16px); opacity: 0; transition: transform .18s ease, opacity .18s ease;
}
.sheet.open { transform: translateY(0); opacity: 1; }
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border); flex: none; }
.sheet-title { font-family: var(--font-serif); font-size: 18px; }
.sheet-close { background: none; border: none; font-size: 16px; color: var(--text-muted); cursor: pointer; padding: 4px 8px; }
.sheet-body { padding: 16px 18px 28px; overflow-y: auto; }

.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
.field input[type=text], .field input[type=number], .field input[type=time], .field select, .field textarea {
  width: 100%; border: 1px solid var(--border); border-radius: var(--radius-s); padding: 10px 11px;
  background: var(--surface); color: var(--ink); font-size: 14.5px;
}
.field textarea { resize: vertical; min-height: 64px; font-family: var(--font-sans); }
.field-hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; }
.field-row { display: flex; gap: 10px; }
.field-row > .field { flex: 1; }

.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; background: var(--surface); cursor: pointer; color: var(--ink-soft); }
.chip.active { background: var(--accent-wash); border-color: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }

.icon-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.icon-opt { font-size: 20px; padding: 8px 0; text-align: center; border-radius: var(--radius-s); border: 1px solid transparent; cursor: pointer; }
.icon-opt.active { background: var(--accent-wash); border-color: var(--accent-soft); }

/* ---- Suggestion list (onboarding) ---- */
.suggest-card { border: 1px solid var(--border); border-radius: var(--radius-m); padding: 12px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; background: var(--surface-raised); }
.suggest-card .icon { font-size: 20px; }
.suggest-card .main { flex: 1; }
.suggest-card .name { font-weight: 600; font-size: 14px; }
.suggest-card .meta { font-size: 12px; color: var(--text-muted); }
.suggest-card input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }

/* ---- Trends ---- */
.range-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.range-tabs button { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); padding: 7px 13px; border-radius: 999px; font-size: 13px; cursor: pointer; }
.range-tabs button.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }
[data-theme="dark"] .range-tabs button.active, :root:not([data-theme="light"]) .range-tabs button.active { }

.trend-card { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 16px; margin-bottom: 14px; }
.trend-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.trend-card .head .icon { font-size: 18px; }
.trend-card .head .name { font-weight: 600; font-size: 15px; flex: 1; }
.trend-card canvas { width: 100%; height: 140px; display: block; }
.trend-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.trend-stat { text-align: center; }
.trend-stat .num { font-size: 15px; font-weight: 700; }
.trend-stat .lbl { font-size: 10.5px; color: var(--text-muted); margin-top: 2px; }

/* ---- Reports ---- */
.report-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.report-tabs button { flex: 1; border: 1px solid var(--border); background: var(--surface); padding: 9px 0; border-radius: var(--radius-s); font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
.report-tabs button.active { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.report-hero { text-align: center; padding: 18px 10px 22px; }
.report-hero .range { color: var(--text-muted); font-size: 13px; }
.report-hero .title { font-family: var(--font-serif); font-size: 24px; margin-top: 4px; }
.report-hero .headline { margin-top: 10px; color: var(--ink-soft); font-size: 14.5px; max-width: 420px; margin-left: auto; margin-right: auto; }

.metric-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
.metric-row:last-child { border-bottom: none; }
.metric-row .left { display: flex; align-items: center; gap: 10px; }
.metric-row .icon { font-size: 18px; }
.metric-row .name { font-weight: 600; font-size: 14px; }
.metric-row .sub { font-size: 12px; color: var(--text-muted); }
.metric-row .right { text-align: right; }
.metric-row .change { font-size: 13.5px; font-weight: 700; }
.metric-row .change.up { color: var(--accent-strong); }
.metric-row .change.down { color: var(--clay); }

.callout { border-radius: var(--radius-m); padding: 14px 16px; margin-bottom: 12px; font-size: 14px; line-height: 1.55; }
.callout.good { background: var(--accent-wash); color: var(--accent-strong); }
.callout.attention { background: var(--clay-wash); color: var(--clay); }
.callout.neutral { background: var(--surface-raised); border: 1px solid var(--border); color: var(--ink-soft); }
.callout h4 { font-size: 12.5px; text-transform: none; margin-bottom: 6px; font-weight: 700; color: inherit; }

.year-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.year-stat { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius-m); padding: 14px; }
.year-stat .icon { font-size: 20px; }
.year-stat .label { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.year-stat .value { font-family: var(--font-serif); font-size: 19px; margin-top: 2px; }

/* ---- Me / list screens ---- */
.list-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--border); }
.list-row .icon { font-size: 19px; width: 26px; text-align: center; }
.list-row .main { flex: 1; min-width: 0; }
.list-row .name { font-weight: 600; font-size: 14.5px; }
.list-row .meta { font-size: 12px; color: var(--text-muted); }
.list-row .action { font-size: 13px; color: var(--text-muted); background: none; border: none; cursor: pointer; padding: 6px 8px; }
.list-row.archived { opacity: 0.55; }

.settings-group { margin-bottom: 22px; }
.settings-group h4 { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; }
.settings-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 2px; border-bottom: 1px solid var(--border); }
.settings-item:last-child { border-bottom: none; }
.settings-item .name { font-size: 14.5px; font-weight: 500; }
.settings-item .desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.theme-row { display: flex; gap: 8px; }
.theme-row button { flex: 1; padding: 10px 0; border-radius: var(--radius-s); border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); font-size: 13px; cursor: pointer; }
.theme-row button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* ---- Calendar (history) ---- */
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 10.5px; color: var(--text-muted); padding-bottom: 4px; }
.cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-s); font-size: 12.5px; cursor: pointer; border: 1px solid transparent; position: relative; color: var(--ink-soft); }
.cal-day.today { border-color: var(--accent); font-weight: 700; color: var(--ink); }
.cal-day.has-data::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.cal-day.minimum::after { background: var(--clay); }
.cal-day.empty { visibility: hidden; }
.cal-month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-month-nav button { background: none; border: none; font-size: 18px; color: var(--ink-soft); cursor: pointer; padding: 4px 10px; }
.cal-month-nav .label { font-family: var(--font-serif); font-size: 16px; }

/* ---- Onboarding ---- */
.onboard-wrap { min-height: 100dvh; display: flex; flex-direction: column; padding: 26px 22px 24px; max-width: 560px; margin: 0 auto; }
.onboard-wrap h1 { font-size: 25px; margin-bottom: 8px; }
.onboard-wrap .lede { color: var(--ink-soft); font-size: 14.5px; margin-bottom: 22px; }
.onboard-actions { margin-top: auto; padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }

.badge-min { display: inline-flex; align-items: center; gap: 6px; background: var(--clay-wash); color: var(--clay); padding: 5px 11px; border-radius: 999px; font-size: 12px; font-weight: 600; }

.toast, #toast-host {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px); transform: translate(-50%, 8px);
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 13.5px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 200; max-width: 86%; text-align: center;
}
#toast-host.show { opacity: 1; transform: translate(-50%, 0); }

.link-plain { color: var(--accent-strong); text-decoration: none; font-weight: 600; }
.muted { color: var(--text-muted); }
.small { font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.hidden { display: none !important; }

::-webkit-scrollbar { width: 0; height: 0; }

</style>
</head>
<body>
<div id="app"><!-- rendered by app.js --></div>

<script>
/* ---- js/db.js ---- */
// ============================================================================
// db.js — IndexedDB wrapper. No external dependencies.
// Everything the app stores lives in one database, one object store per
// concept. All functions return Promises.
// ============================================================================

const DB_NAME = 'life-dashboard';
const DB_VERSION = 1;

let _dbPromise = null;

function openDB() {
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (event) => {
      const db = event.target.result;

      // Trackers: the generic definition of "a thing the user tracks"
      if (!db.objectStoreNames.contains('trackers')) {
        const s = db.createObjectStore('trackers', { keyPath: 'id' });
        s.createIndex('category', 'category', { unique: false });
        s.createIndex('archivedAt', 'archivedAt', { unique: false });
      }

      // Entries: one value of one tracker on one date
      if (!db.objectStoreNames.contains('entries')) {
        const s = db.createObjectStore('entries', { keyPath: 'id' });
        s.createIndex('trackerId', 'trackerId', { unique: false });
        s.createIndex('date', 'date', { unique: false });
        s.createIndex('trackerId_date', ['trackerId', 'date'], { unique: true });
      }

      // Life events: periods that explain unusual data
      if (!db.objectStoreNames.contains('lifeEvents')) {
        const s = db.createObjectStore('lifeEvents', { keyPath: 'id' });
        s.createIndex('startDate', 'startDate', { unique: false });
      }

      // Experiments: time-boxed self-tests
      if (!db.objectStoreNames.contains('experiments')) {
        db.createObjectStore('experiments', { keyPath: 'id' });
      }

      // Daily notes: one record per date (note, mood, energy, good thing,
      // minimum-day status)
      if (!db.objectStoreNames.contains('dailyNotes')) {
        db.createObjectStore('dailyNotes', { keyPath: 'date' });
      }

      // Settings: small single-row key/value bag (onboarding state, theme,
      // selected categories, etc.)
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };

    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
  return _dbPromise;
}

function tx(storeNames, mode = 'readonly') {
  return openDB().then((db) => db.transaction(storeNames, mode));
}

// --- generic helpers ------------------------------------------------------

async function dbGet(store, key) {
  const t = await tx([store]);
  return new Promise((resolve, reject) => {
    const req = t.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetAll(store) {
  const t = await tx([store]);
  return new Promise((resolve, reject) => {
    const req = t.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbPut(store, value) {
  const t = await tx([store], 'readwrite');
  return new Promise((resolve, reject) => {
    const req = t.objectStore(store).put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}

async function dbDelete(store, key) {
  const t = await tx([store], 'readwrite');
  return new Promise((resolve, reject) => {
    const req = t.objectStore(store).delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

async function dbGetByIndex(store, indexName, value) {
  const t = await tx([store]);
  return new Promise((resolve, reject) => {
    const req = t.objectStore(store).index(indexName).getAll(value);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

async function dbClearAll() {
  const storeNames = ['trackers', 'entries', 'lifeEvents', 'experiments', 'dailyNotes', 'settings'];
  const t = await tx(storeNames, 'readwrite');
  await Promise.all(storeNames.map((name) => new Promise((resolve, reject) => {
    const req = t.objectStore(name).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  })));
  return true;
}

async function dbExportAll() {
  const [trackers, entries, lifeEvents, experiments, dailyNotes, settings] = await Promise.all([
    dbGetAll('trackers'),
    dbGetAll('entries'),
    dbGetAll('lifeEvents'),
    dbGetAll('experiments'),
    dbGetAll('dailyNotes'),
    dbGetAll('settings'),
  ]);
  return {
    _meta: {
      app: 'life-dashboard',
      exportedAt: new Date().toISOString(),
      version: DB_VERSION,
    },
    trackers, entries, lifeEvents, experiments, dailyNotes, settings,
  };
}

async function dbImportAll(data) {
  if (!data || typeof data !== 'object') throw new Error('Invalid backup file');
  const requiredArrays = ['trackers', 'entries', 'lifeEvents', 'experiments', 'dailyNotes', 'settings'];
  for (const key of requiredArrays) {
    if (!Array.isArray(data[key])) throw new Error(`Backup file is missing "${key}"`);
  }
  await dbClearAll();
  const t = await tx(requiredArrays, 'readwrite');
  for (const storeName of requiredArrays) {
    const store = t.objectStore(storeName);
    for (const item of data[storeName]) store.put(item);
  }
  return new Promise((resolve, reject) => {
    t.oncomplete = () => resolve(true);
    t.onerror = () => reject(t.error);
  });
}

function uid() {
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
}

window.DB = {
  get: dbGet,
  getAll: dbGetAll,
  put: dbPut,
  delete: dbDelete,
  getByIndex: dbGetByIndex,
  clearAll: dbClearAll,
  exportAll: dbExportAll,
  importAll: dbImportAll,
  uid,
};


/* ---- js/dates.js ---- */
// ============================================================================
// dates.js — date helpers shared across the app.
// Dates are stored/keyed as 'YYYY-MM-DD' strings in local time, never as
// timestamps, so history never shifts with timezone changes.
// ============================================================================

function pad2(n) { return String(n).padStart(2, '0'); }

function toDateKey(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function todayKey() { return toDateKey(new Date()); }

function keyToDate(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function addDays(key, n) {
  const d = keyToDate(key);
  d.setDate(d.getDate() + n);
  return toDateKey(d);
}

function daysBetween(startKey, endKey) {
  const a = keyToDate(startKey);
  const b = keyToDate(endKey);
  return Math.round((b - a) / 86400000);
}

function dateRangeKeys(startKey, endKey) {
  const out = [];
  let cur = startKey;
  while (cur <= endKey) {
    out.push(cur);
    cur = addDays(cur, 1);
  }
  return out;
}

function formatFriendly(key) {
  const d = keyToDate(key);
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

function formatShort(key) {
  const d = keyToDate(key);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function formatMonthYear(key) {
  const d = keyToDate(key);
  return d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
}

function isWeekend(key) {
  const day = keyToDate(key).getDay();
  return day === 0 || day === 6;
}

function greeting() {
  const h = new Date().getHours();
  if (h < 5) return 'Still up late.';
  if (h < 12) return 'Good morning.';
  if (h < 17) return 'Good afternoon.';
  if (h < 21) return 'Good evening.';
  return 'Winding down for the night.';
}

// Does a tracker "expect" an entry on this date, given its frequency config?
// frequency: { type: 'daily'|'weekdays'|'weekends'|'days'|'weekly'|'monthly'|'custom'|'perweek', days?: [0-6], timesPerWeek?: n }
function isScheduledOn(tracker, dateKey) {
  const freq = tracker.frequency || { type: 'daily' };
  const dow = keyToDate(dateKey).getDay();
  switch (freq.type) {
    case 'weekdays': return dow >= 1 && dow <= 5;
    case 'weekends': return dow === 0 || dow === 6;
    case 'days': return Array.isArray(freq.days) && freq.days.includes(dow);
    case 'weekly': return dow === (freq.anchorDow ?? 1);
    case 'monthly': return keyToDate(dateKey).getDate() === (freq.dayOfMonth ?? 1);
    case 'perweek': return true; // evaluated in aggregate, treat every day as eligible
    case 'daily':
    default: return true;
  }
}

window.DateUtil = {
  pad2, toDateKey, todayKey, keyToDate, addDays, daysBetween, dateRangeKeys,
  formatFriendly, formatShort, formatMonthYear, isWeekend, greeting, isScheduledOn,
};


/* ---- js/ui.js ---- */
// ============================================================================
// ui.js — small reusable UI primitives: toasts, confirm dialogs, bottom
// sheets/modals, and a couple of DOM shorthand helpers.
// ============================================================================

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) node.setAttribute(k, v);
  }
  for (const c of [].concat(children)) {
    if (c === null || c === undefined) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

let toastTimer = null;
function toast(message) {
  let host = document.getElementById('toast-host');
  if (!host) {
    host = el('div', { id: 'toast-host' });
    document.body.appendChild(host);
  }
  host.textContent = message;
  host.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => host.classList.remove('show'), 2200);
}

// Returns a Promise<boolean>
function confirmDialog({ title, message, confirmLabel = 'Confirm', danger = false }) {
  return new Promise((resolve) => {
    const overlay = el('div', { class: 'overlay' });
    const box = el('div', { class: 'dialog' }, [
      el('h3', {}, title),
      el('p', {}, message),
      el('div', { class: 'dialog-actions' }, [
        el('button', { class: 'btn btn-ghost', onclick: () => { close(false); } }, 'Cancel'),
        el('button', { class: danger ? 'btn btn-danger' : 'btn btn-primary', onclick: () => { close(true); } }, confirmLabel),
      ]),
    ]);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    function close(result) {
      overlay.remove();
      resolve(result);
    }
    overlay.addEventListener('click', (e) => { if (e.target === overlay) close(false); });
  });
}

// contentBuilder(closeFn) -> HTMLElement. Returns a close() function.
function openSheet(contentBuilder, { title = '' } = {}) {
  const overlay = el('div', { class: 'overlay sheet-overlay' });
  const sheet = el('div', { class: 'sheet' });
  const close = () => overlay.remove();
  const header = el('div', { class: 'sheet-header' }, [
    el('span', { class: 'sheet-title' }, title),
    el('button', { class: 'sheet-close', 'aria-label': 'Close', onclick: close }, '✕'),
  ]);
  sheet.appendChild(header);
  const body = el('div', { class: 'sheet-body' });
  sheet.appendChild(body);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  body.appendChild(contentBuilder(close));
  requestAnimationFrame(() => sheet.classList.add('open'));
  return close;
}

function formatValueForDisplay(tracker, value) {
  if (value === undefined || value === null || value === '') return '—';
  switch (tracker.type) {
    case 'yesno': return value === true || value === 'true' ? 'Yes' : 'No';
    case 'currency': return `${tracker.unit || ''}${value}`.trim();
    case 'rating': return `${value}/5`;
    case 'choice': return String(value);
    default: return tracker.unit ? `${value} ${tracker.unit}` : String(value);
  }
}

window.UI = { el, toast, confirmDialog, openSheet, formatValueForDisplay };


/* ---- js/settings.js ---- */
// ============================================================================
// settings.js — small key/value app settings (onboarding state, theme,
// selected life categories) stored in the 'settings' object store.
// ============================================================================

async function getSetting(key, fallback = null) {
  const row = await DB.get('settings', key);
  return row ? row.value : fallback;
}

async function setSetting(key, value) {
  return DB.put('settings', { key, value });
}

async function applyTheme() {
  const theme = await getSetting('theme', 'auto');
  const root = document.documentElement;
  if (theme === 'auto') {
    root.removeAttribute('data-theme');
  } else {
    root.setAttribute('data-theme', theme);
  }
}

window.Settings = { get: getSetting, set: setSetting, applyTheme };


/* ---- js/charts.js ---- */
// ============================================================================
// charts.js — tiny canvas line/bar chart renderer. No dependency, because
// the app must keep working offline and installed, without a CDN.
// ============================================================================

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// points: [{x: dateKey, y: number|null}], goal: number|null (horizontal line)
function drawLineChart(canvas, points, { goal = null, color = null, formatY = (v) => v } = {}) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height || 160;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const padL = 36, padR = 10, padT = 12, padB = 20;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  const valid = points.filter((p) => p.y !== null && p.y !== undefined && !Number.isNaN(p.y));
  if (valid.length === 0) {
    ctx.fillStyle = cssVar('--text-muted') || '#888';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText('Not enough data yet', padL, h / 2);
    return;
  }

  let min = Math.min(...valid.map((p) => p.y));
  let max = Math.max(...valid.map((p) => p.y));
  if (goal !== null && !Number.isNaN(goal)) { min = Math.min(min, goal); max = Math.max(max, goal); }
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  min -= span * 0.08; max += span * 0.08;

  const n = points.length;
  const xAt = (i) => padL + (n <= 1 ? plotW / 2 : (plotW * i) / (n - 1));
  const yAt = (v) => padT + plotH - ((v - min) / (max - min)) * plotH;

  // gridlines + y labels
  ctx.strokeStyle = cssVar('--border') || '#e5e5e0';
  ctx.fillStyle = cssVar('--text-muted') || '#888';
  ctx.font = '11px system-ui, sans-serif';
  ctx.lineWidth = 1;
  const gridN = 3;
  for (let g = 0; g <= gridN; g++) {
    const v = min + (span * g) / gridN;
    const y = yAt(v);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    ctx.fillText(formatY(v), 2, y + 3);
  }

  // goal line
  if (goal !== null && !Number.isNaN(goal)) {
    const gy = yAt(goal);
    ctx.save();
    ctx.strokeStyle = cssVar('--accent-soft') || '#9ab89f';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(padL, gy);
    ctx.lineTo(w - padR, gy);
    ctx.stroke();
    ctx.restore();
  }

  // line
  ctx.strokeStyle = color || cssVar('--accent') || '#4f7a5c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  let started = false;
  points.forEach((p, i) => {
    if (p.y === null || p.y === undefined || Number.isNaN(p.y)) { started = false; return; }
    const x = xAt(i), y = yAt(p.y);
    if (!started) { ctx.moveTo(x, y); started = true; } else { ctx.lineTo(x, y); }
  });
  ctx.stroke();

  // dots
  ctx.fillStyle = color || cssVar('--accent') || '#4f7a5c';
  points.forEach((p, i) => {
    if (p.y === null || p.y === undefined || Number.isNaN(p.y)) return;
    const x = xAt(i), y = yAt(p.y);
    ctx.beginPath();
    ctx.arc(x, y, 2.2, 0, Math.PI * 2);
    ctx.fill();
  });
}

// bars: [{label, value}]
function drawBarChart(canvas, bars, { color = null, formatY = (v) => v } = {}) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = rect.width, h = rect.height || 140;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);

  const padL = 30, padR = 8, padT = 10, padB = 18;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const max = Math.max(1, ...bars.map((b) => b.value || 0));
  const bw = plotW / bars.length;

  ctx.fillStyle = color || cssVar('--accent') || '#4f7a5c';
  bars.forEach((b, i) => {
    const bh = ((b.value || 0) / max) * plotH;
    const x = padL + i * bw + bw * 0.18;
    const y = padT + plotH - bh;
    ctx.globalAlpha = b.value > 0 ? 1 : 0.15;
    ctx.fillRect(x, y, bw * 0.64, Math.max(bh, 1));
    ctx.globalAlpha = 1;
  });

  ctx.fillStyle = cssVar('--text-muted') || '#888';
  ctx.font = '10px system-ui, sans-serif';
  bars.forEach((b, i) => {
    if (bars.length > 10 && i % Math.ceil(bars.length / 8) !== 0) return;
    ctx.fillText(b.label, padL + i * bw, h - 4);
  });
}

window.Charts = { drawLineChart, drawBarChart };


/* ---- js/trackers.js ---- */
// ============================================================================
// trackers.js — the generic Tracker model: CRUD, the suggested-tracker
// catalogue used during onboarding, goal evaluation, and consistency maths.
// Nothing in this file mentions "weight" or "walking" as special cases —
// they are just entries in CATALOGUE.
// ============================================================================

const TRACKER_TYPES = {
  number: { label: 'Number', example: 'e.g. 91.5 kg' },
  yesno: { label: 'Yes / No', example: 'e.g. Exercised today?' },
  time: { label: 'Time', example: 'e.g. Wake-up time' },

function newTracker(overrides = {}) {

    name: 'Untitled tracker',
    icon: '⭐',
    category: 'other',
    type: 'number',
    unit: '',
    goal: null,

    notes: '',
    order: Date.now(),
    createdAt: new Date().toISOString(),
    archivedAt: null,
    choiceOptions: [],
    ...overrides,
  };
}

async function listTrackers({ includeArchived = false } = {}) {
  const all = await DB.getAll('trackers');
  const filtered = includeArchived ? all : all.filter((t) => !t.archivedAt);
  return filtered.sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
}

async function getTracker(id) { return DB.get('trackers', id); }
async function saveTracker(tracker) { return DB.put('trackers', tracker); }
async function archiveTracker(id) {
  const t = await getTracker(id);
  if (!t) return;
  t.archivedAt = new Date().toISOString();
  return DB.put('trackers', t);
}
async function restoreTracker(id) {
  const t = await getTracker(id);
  if (!t) return;
  t.archivedAt = null;
  return DB.put('trackers', t);
}
async function deleteTrackerAndEntries(id) {
  const entries = await DB.getByIndex('entries', 'trackerId', id);
  for (const e of entries) await DB.delete('entries', e.id);
  return DB.delete('trackers', id);
}

// Entry helpers -------------------------------------------------------------

async function getEntry(trackerId, dateKey) {
  const rows = await DB.getByIndex('entries', 'trackerId_date', [trackerId, dateKey]);
  return rows[0] || null;
}

async function setEntry(trackerId, dateKey, value, note = '') {
  const existing = await getEntry(trackerId, dateKey);
  const now = new Date().toISOString();
  const row = existing
    ? { ...existing, value, note, updatedAt: now }
    : { id: DB.uid(), trackerId, date: dateKey, value, note, createdAt: now, updatedAt: now };
  return DB.put('entries', row);
}

async function deleteEntry(trackerId, dateKey) {
  const existing = await getEntry(trackerId, dateKey);
  if (existing) await DB.delete('entries', existing.id);
}

async function entriesForTracker(trackerId) {
  const rows = await DB.getByIndex('entries', 'trackerId', trackerId);
  return rows.sort((a, b) => (a.date < b.date ? -1 : 1));
}

async function entriesForDate(dateKey) {
  return DB.getByIndex('entries', 'date', dateKey);
}

async function entriesInRange(trackerId, startKey, endKey) {
  const all = await entriesForTracker(trackerId);
  return all.filter((e) => e.date >= startKey && e.date <= endKey);
}

// Goal evaluation -------------------------------------------------------------

// Returns true/false/null (null = no target set, so "reached" is meaningless)
function goalReached(tracker, value) {
  if (value === undefined || value === null || value === '') return null;
  const dir = tracker.goalDirection || 'none';
  if (dir === 'none' || tracker.goal === null || tracker.goal === undefined || tracker.goal === '') return null;

  if (tracker.type === 'time') {
    // compare HH:MM strings on a same-day basis
    const toMinutes = (t) => {
      const [h, m] = String(t).split(':').map(Number);
      return h * 60 + m;
    };
    const v = toMinutes(value);
    const g = toMinutes(tracker.goal);
    if (dir === 'before') return v <= g;
    if (dir === 'after') return v >= g;
    if (dir === 'exactly') return v === g;
    return null;
  }

  const v = Number(value);
  const g = Number(tracker.goal);
  if (Number.isNaN(v) || Number.isNaN(g)) return null;
  if (dir === 'atleast') return v >= g;
  if (dir === 'atmost') return v <= g;
  if (dir === 'exactly') return v === g;
  return null;
}

function goalLabel(tracker) {
  if (!tracker.goal && tracker.goal !== 0) return null;
  const dir = tracker.goalDirection;
  const unit = tracker.unit ? ` ${tracker.unit}` : '';
  const g = tracker.type === 'time' ? tracker.goal : `${tracker.goal}${unit}`;
  switch (dir) {
    case 'atleast': return `At least ${g}`;
    case 'atmost': return `At most ${g}`;
    case 'exactly': return `Exactly ${g}`;
    case 'before': return `Before ${g}`;
    case 'after': return `After ${g}`;
    default: return null;
  }
}

// Consistency: completed target days / expected tracking days, over a
// window. "Expected" excludes dates before the tracker existed, dates while
// archived, and dates not scheduled by frequency. "No entry" is distinct
// from "entered but goal not reached" — both count against consistency,
// but callers can inspect entries to tell them apart.
async function consistency(tracker, startKey, endKey) {
  const today = DateUtil.todayKey();
  const clampedEnd = endKey > today ? today : endKey;
  const createdKey = tracker.createdAt ? DateUtil.toDateKey(new Date(tracker.createdAt)) : startKey;
  const effectiveStart = startKey < createdKey ? createdKey : startKey;
  if (effectiveStart > clampedEnd) return { expected: 0, completed: 0, entered: 0, pct: null };

  const allDates = DateUtil.dateRangeKeys(effectiveStart, clampedEnd);
  const expectedDates = allDates.filter((d) => DateUtil.isScheduledOn(tracker, d));
  const entries = await entriesInRange(tracker.id, effectiveStart, clampedEnd);
  const byDate = new Map(entries.map((e) => [e.date, e]));

  let completed = 0;
  let entered = 0;
  for (const d of expectedDates) {
    const e = byDate.get(d);
    if (e) {
      entered++;
      const reached = goalReached(tracker, e.value);
      if (reached === true || reached === null) completed++; // no target => logging counts as success
    }
  }
  const expected = expectedDates.length;
  return { expected, completed, entered, pct: expected > 0 ? Math.round((completed / expected) * 100) : null };
}

window.Trackers = {
  TRACKER_TYPES, GOAL_DIRECTIONS, CATALOGUE, CATEGORY_LABELS,
  newTracker, listTrackers, getTracker, saveTracker, archiveTracker, restoreTracker, deleteTrackerAndEntries,
  getEntry, setEntry, deleteEntry, entriesForTracker, entriesForDate, entriesInRange,
  goalReached, goalLabel, consistency,
};

const ICON_CHOICES = ['⭐','⚖️','💧','🍽','🛏','🚶','👟','🏃','💪','🌙','⏰','😴','💰','🍔','🏦',

  '🎵','🎨','🧘','🚭','🚰','📵','🧠','🌤','🐾','🧹','🧾','🎓'];

function openTrackerEditor(existing, onSaved) {
  const isEdit = !!existing;
  const t = existing ? { ...existing } : Trackers.newTracker();

  UI.openSheet((close) => {
    const wrap = UI.el('div', { class: 'stack' });

    // -- name
    const nameField = UI.el('div', { class: 'field' }, [
      UI.el('label', {}, 'What do you want to track?'),
      UI.el('input', { type: 'text', value: t.name, placeholder: 'e.g. Weight, Prayer, Time with Mia',
        oninput: (e) => { t.name = e.target.value; } }),
    ]);
    wrap.appendChild(nameField);

    // -- type
    const typeField = UI.el('div', { class: 'field' }, [
      UI.el('label', {}, 'Type'),
      UI.el('select', { onchange: (e) => { t.type = e.target.value; rebuildTypeExtras(); } },
        Object.entries(Trackers.TRACKER_TYPES).map(([key, def]) =>
          UI.el('option', { value: key, ...(t.type === key ? { selected: 'selected' } : {}) }, def.label))),
      UI.el('div', { class: 'field-hint', id: 'type-example' }, Trackers.TRACKER_TYPES[t.type].example),
    ]);
    wrap.appendChild(typeField);

    // -- icon grid
    const iconGrid = UI.el('div', { class: 'icon-grid' });
    ICON_CHOICES.forEach((ic) => {
      const btn = UI.el('div', { class: `icon-opt${t.icon === ic ? ' active' : ''}`, onclick: () => {
        t.icon = ic;
        iconGrid.querySelectorAll('.icon-opt').forEach((n) => n.classList.remove('active'));
        btn.classList.add('active');
      } }, ic);
      iconGrid.appendChild(btn);
    });
    wrap.appendChild(UI.el('div', { class: 'field' }, [UI.el('label', {}, 'Icon'), iconGrid]));

    // -- category
    const catField = UI.el('div', { class: 'field' }, [
      UI.el('label', {}, 'Category'),
      UI.el('select', { onchange: (e) => { t.category = e.target.value; } },
        Object.entries(Trackers.CATEGORY_LABELS).map(([key, label]) =>
          UI.el('option', { value: key, ...(t.category === key ? { selected: 'selected' } : {}) }, label))),
    ]);
    wrap.appendChild(catField);

    const extrasHost = UI.el('div');
    wrap.appendChild(extrasHost);

    function rebuildTypeExtras() {
      extrasHost.innerHTML = '';
      document.getElementById('type-example') && (document.getElementById('type-example').textContent = Trackers.TRACKER_TYPES[t.type].example);

      const needsUnit = ['number', 'count', 'duration', 'currency'].includes(t.type);
      const needsGoal = !['text'].includes(t.type);
      const needsChoiceOptions = t.type === 'choice';

      if (needsUnit) {
        extrasHost.appendChild(UI.el('div', { class: 'field' }, [
          UI.el('label', {}, 'Unit (optional)'),
          UI.el('input', { type: 'text', value: t.unit || '', placeholder: t.type === 'duration' ? 'minutes' : t.type === 'currency' ? '₹' : 'kg',
            oninput: (e) => { t.unit = e.target.value; } }),
        ]));
      }

      if (needsChoiceOptions) {
        extrasHost.appendChild(UI.el('div', { class: 'field' }, [
          UI.el('label', {}, 'Options (comma separated)'),
          UI.el('input', { type: 'text', value: (t.choiceOptions || []).join(', '), placeholder: 'Low, Normal, High',
            oninput: (e) => { t.choiceOptions = e.target.value.split(',').map((s) => s.trim()).filter(Boolean); } }),
        ]));
      }

      if (needsGoal && t.type !== 'yesno' && t.type !== 'choice') {
        const dirOptions = t.type === 'time'
          ? ['none', 'before', 'after']
          : ['none', 'atleast', 'atmost', 'exactly'];
        const goalRow = UI.el('div', { class: 'field-row' }, [
          UI.el('div', { class: 'field' }, [
            UI.el('label', {}, 'Goal direction'),
            UI.el('select', { onchange: (e) => { t.goalDirection = e.target.value; renderGoalValue(); } },
              dirOptions.map((d) => UI.el('option', { value: d, ...(t.goalDirection === d ? { selected: 'selected' } : {}) }, Trackers.GOAL_DIRECTIONS[d]))),
          ]),
        ]);
        extrasHost.appendChild(goalRow);
        const goalValueHost = UI.el('div');
        extrasHost.appendChild(goalValueHost);
        function renderGoalValue() {
          goalValueHost.innerHTML = '';
          if (t.goalDirection === 'none') return;
          const input = t.type === 'time'
            ? UI.el('input', { type: 'time', value: t.goal || '', oninput: (e) => { t.goal = e.target.value; } })
            : UI.el('input', { type: 'number', step: 'any', value: t.goal ?? '', placeholder: 'Target value', oninput: (e) => { t.goal = e.target.value; } });
          goalValueHost.appendChild(UI.el('div', { class: 'field' }, [UI.el('label', {}, 'Target'), input]));
        }
        renderGoalValue();
      } else {
        t.goalDirection = 'none';
        t.goal = null;
      }

      // frequency
      const freqOptions = { daily: 'Daily', weekdays: 'Weekdays', weekends: 'Weekends', perweek: 'X times per week', weekly: 'Weekly', monthly: 'Monthly' };
      const freqType = (t.frequency && t.frequency.type) || 'daily';
      const freqRow = UI.el('div', { class: 'field' }, [
        UI.el('label', {}, 'How often'),
        UI.el('select', { onchange: (e) => {
          t.frequency = { type: e.target.value };
          if (e.target.value === 'perweek') t.frequency.timesPerWeek = 3;
        } }, Object.entries(freqOptions).map(([k, label]) => UI.el('option', { value: k, ...(freqType === k ? { selected: 'selected' } : {}) }, label))),
      ]);
      extrasHost.appendChild(freqRow);

      // show on today toggle
      extrasHost.appendChild(UI.el('div', { class: 'settings-item' }, [
        UI.el('div', {}, [UI.el('div', { class: 'name' }, 'Show on Today'), UI.el('div', { class: 'desc' }, 'Appears as a quick-entry card')]),
        UI.el('input', { type: 'checkbox', ...(t.showOnToday ? { checked: 'checked' } : {}), onchange: (e) => { t.showOnToday = e.target.checked; } }),
      ]));

      extrasHost.appendChild(UI.el('div', { class: 'field' }, [
        UI.el('label', {}, 'Notes (optional)'),
        UI.el('textarea', { oninput: (e) => { t.notes = e.target.value; } }, t.notes || ''),
      ]));
    }
    rebuildTypeExtras();

    const actions = UI.el('div', { class: 'stack', style: 'margin-top: 10px;' }, [
      UI.el('button', { class: 'btn btn-primary btn-block', onclick: async () => {
        if (!t.name || !t.name.trim()) { UI.toast('Give the tracker a name first'); return; }
        await Trackers.saveTracker(t);
        close();
        UI.toast(isEdit ? 'Tracker updated' : 'Tracker created');
        onSaved && onSaved(t);
      } }, isEdit ? 'Save changes' : 'Create tracker'),
    ]);

    if (isEdit) {
      actions.appendChild(UI.el('button', { class: 'btn btn-ghost btn-block', onclick: async () => {
        const ok = await UI.confirmDialog({ title: 'Archive this tracker?', message: 'It will disappear from Today, but all history stays and reports keep using it.', confirmLabel: 'Archive' });
        if (ok) { await Trackers.archiveTracker(t.id); close(); UI.toast('Tracker archived'); onSaved && onSaved(t); }
      } }, 'Archive tracker'));
    }

    wrap.appendChild(actions);
    return wrap;
  }, { title: isEdit ? 'Edit tracker' : 'Add tracker' });
}

// ============================================================================
// onboarding.js — first-run experience: pick life areas, choose suggested
// trackers, optionally load sample data. Nothing here is forced on the user.

const CATEGORY_ORDER = ['health', 'fitness', 'sleep', 'money', 'wellbeing', 'career', 'learning',
  'reading', 'family', 'relationships', 'spiritual', 'productivity', 'growth', 'other'];

function renderOnboarding(root) {
  root.innerHTML = '';
  const state = { step: 'welcome', selectedCategories: new Set(), selectedTrackers: new Map() };

  function renderWelcome() {
    root.innerHTML = '';
    const wrap = UI.el('div', { class: 'onboard-wrap' }, [
      UI.el('h1', {}, 'Welcome to your Life Dashboard.'),
      UI.el('p', { class: 'lede' }, 'A quiet place to notice what\u2019s actually happening in your life — not another streak app. Everything you enter stays only on this device.'),
      UI.el('p', { class: 'lede' }, 'What would you like to improve or understand better?'),
    ]);
    root.appendChild(wrap);
    const grid = UI.el('div', { class: 'chip-grid' });
    CATEGORY_ORDER.forEach((cat) => {
      const chip = UI.el('div', { class: 'chip', onclick: () => {
        if (state.selectedCategories.has(cat)) { state.selectedCategories.delete(cat); chip.classList.remove('active'); }
        else { state.selectedCategories.add(cat); chip.classList.add('active'); }
      } }, Trackers.CATEGORY_LABELS[cat]);
      grid.appendChild(chip);
    });
    wrap.appendChild(grid);
    const actions = UI.el('div', { class: 'onboard-actions' }, [
      UI.el('button', { class: 'btn btn-primary btn-block', onclick: () => {
        if (state.selectedCategories.size === 0) { UI.toast('Pick at least one area, or explore with sample data below'); return; }
        renderSuggestions();
      } }, 'Continue'),
      UI.el('button', { class: 'btn-link', style: 'text-align:center;', onclick: renderSampleOption }, 'Explore with sample data instead'),
    ]);
    wrap.appendChild(actions);
  }

  function renderSuggestions() {
    root.innerHTML = '';
    const wrap = UI.el('div', { class: 'onboard-wrap' }, [
      UI.el('h1', {}, 'Here are a few trackers that fit.'),
      UI.el('p', { class: 'lede' }, 'Turn on whatever feels useful. You can add, change or remove trackers any time later.'),
    ]);
    root.appendChild(wrap);
    const list = UI.el('div');
    wrap.appendChild(list);

    [...state.selectedCategories].forEach((cat) => {
      const suggestions = Trackers.CATALOGUE[cat] || [];
      if (suggestions.length === 0) return;
      list.appendChild(UI.el('h3', { class: 'section-title' }, Trackers.CATEGORY_LABELS[cat]));
      suggestions.forEach((s) => {
        const key = `${cat}:${s.name}`;
        const card = UI.el('label', { class: 'suggest-card' }, [
          UI.el('span', { class: 'icon' }, s.icon),
          UI.el('div', { class: 'main' }, [
            UI.el('div', { class: 'name' }, s.name),
            UI.el('div', { class: 'meta' }, Trackers.TRACKER_TYPES[s.type].label),
          ]),
          UI.el('input', { type: 'checkbox', onchange: (e) => {
            if (e.target.checked) state.selectedTrackers.set(key, { ...s, category: cat });
            else state.selectedTrackers.delete(key);
          } }),
        ]);
        list.appendChild(card);
      });
    });

    wrap.appendChild(UI.el('button', { class: 'btn-link', onclick: () => {
      TrackerEditor.open(null, () => {});
    } }, '+ Create my own tracker'));

    const actions = UI.el('div', { class: 'onboard-actions' }, [
      UI.el('button', { class: 'btn btn-primary btn-block', onclick: finishOnboarding }, 'Start tracking'),
      UI.el('button', { class: 'btn btn-ghost btn-block', onclick: renderWelcome }, 'Back'),
    ]);
    wrap.appendChild(actions);
  }

  function renderSampleOption() {
    root.innerHTML = '';
    const wrap = UI.el('div', { class: 'onboard-wrap' }, [
      UI.el('h1', {}, 'Explore with sample data'),
      UI.el('p', { class: 'lede' }, 'We\u2019ll fill the app with about 30 days of realistic made-up data so you can see how Today, Trends and Reports work. Nothing here is your real data — you can delete it and start fresh whenever you like.'),
    ]);
    root.appendChild(wrap);
    const actions = UI.el('div', { class: 'onboard-actions' }, [
      UI.el('button', { class: 'btn btn-primary btn-block', onclick: async () => {
        await SampleData.populate();
        await Settings.set('onboarded', true);
        await Settings.set('sampleDataActive', true);
        UI.toast('Sample data loaded');
        App.start();
      } }, 'Load sample data'),
      UI.el('button', { class: 'btn btn-ghost btn-block', onclick: renderWelcome }, 'Back'),
    ]);
    wrap.appendChild(actions);
  }

  async function finishOnboarding() {
    for (const [, tmpl] of state.selectedTrackers) {
      await Trackers.saveTracker(Trackers.newTracker({
        name: tmpl.name, icon: tmpl.icon, category: tmpl.category, type: tmpl.type,
        unit: tmpl.unit || '', goal: tmpl.goal ?? null, goalDirection: tmpl.goalDirection || 'none',
      }));
    }
    await Settings.set('onboarded', true);
    await Settings.set('selectedCategories', [...state.selectedCategories]);
    UI.toast('You\u2019re all set');
    App.start();
  }

  renderWelcome();
}

window.Onboarding = { render: renderOnboarding };

// ============================================================================
// today.js — the Today screen: fast entry for every active tracker, the
// daily note, and Minimum Day mode.
// ============================================================================

const TodayScreen = (() => {
  let viewDate = DateUtil.todayKey();

  async function render(root) {
    root.innerHTML = '';
    const [trackers, entries, note] = await Promise.all([
      Trackers.listTrackers(),
      Trackers.entriesForDate(viewDate),
      DB.get('dailyNotes', viewDate),
    ]);
    const entryByTracker = new Map(entries.map((e) => [e.trackerId, e]));
    const todayTrackers = trackers.filter((t) => t.showOnToday !== false);

    // -- header
    const isToday = viewDate === DateUtil.todayKey();
    const header = UI.el('div', { class: 'top-header' }, [
      UI.el('div', { style: 'display:flex; align-items:center; justify-content:space-between;' }, [
        UI.el('div', {}, [
          UI.el('div', { class: 'dow' }, isToday ? 'Today' : DateUtil.formatShort(viewDate)),
          UI.el('div', { class: 'date' }, DateUtil.keyToDate(viewDate).toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })),
        ]),
        dateNav(),
      ]),
      isToday ? UI.el('div', { class: 'greeting' }, DateUtil.greeting()) : null,
    ]);
    root.appendChild(header);

    // -- minimum day banner
    const minimumDay = note && note.minimumDay && note.minimumDay.active ? note.minimumDay : null;
    if (minimumDay) {
      root.appendChild(renderMinimumDay(minimumDay));
    } else {
      // progress line
      let completed = 0, withGoal = 0;
      todayTrackers.forEach((t) => {
        if (t.goalDirection && t.goalDirection !== 'none') {
          withGoal++;
          const e = entryByTracker.get(t.id);
          if (e && Trackers.goalReached(t, e.value) === true) completed++;
        }
      });
      if (withGoal > 0) {
        root.appendChild(UI.el('div', { class: 'progress-line' }, [
          UI.el('span', { class: 'dot' }),
          UI.el('span', {}, `${completed} of ${withGoal} goals completed`),
        ]));
      }
      root.appendChild(UI.el('button', { class: 'btn-link', onclick: () => openMinimumDayPicker(todayTrackers) }, 'Having a hard day? Switch to Minimum Day'));
    }

    // -- tracker cards
    if (todayTrackers.length === 0) {
      root.appendChild(UI.el('div', { class: 'empty-state' }, [
        UI.el('h3', {}, 'Nothing set up yet'),
        UI.el('p', {}, 'Add a tracker to start logging your day in seconds.'),
        UI.el('button', { class: 'btn btn-primary', onclick: () => TrackerEditor.open(null, () => render(root)) }, '+ Add tracker'),
      ]));
    } else {
      const list = UI.el('div', { class: 'tracker-list' });
      todayTrackers.forEach((t) => list.appendChild(renderTrackerCard(t, entryByTracker.get(t.id), root)));
      root.appendChild(list);
    }

    // -- daily note
    root.appendChild(renderDailyNote(note));
  }

  function dateNav() {
    return UI.el('div', { style: 'display:flex; align-items:center; gap:4px;' }, [
      UI.el('button', { class: 'stepper-btn', 'aria-label': 'Previous day', onclick: () => { viewDate = DateUtil.addDays(viewDate, -1); render(document.getElementById('screen-today')); } }, '‹'),
      UI.el('input', {
        type: 'date', value: viewDate, style: 'border:none; background:none; color:var(--text-muted); font-size:12px; width:34px; padding:0;',
        onchange: (e) => { if (e.target.value) { viewDate = e.target.value; render(document.getElementById('screen-today')); } },
      }),
      UI.el('button', { class: 'stepper-btn', 'aria-label': 'Next day', disabled: viewDate >= DateUtil.todayKey() ? 'disabled' : null,
        onclick: () => { if (viewDate < DateUtil.todayKey()) { viewDate = DateUtil.addDays(viewDate, 1); render(document.getElementById('screen-today')); } } }, '›'),
    ]);
  }

  function renderMinimumDay(minimumDay) {
    const box = UI.el('div', { class: 'progress-line', style: 'background: var(--clay-wash); flex-direction:column; align-items:flex-start; gap:8px;' }, [
      UI.el('span', { class: 'badge-min' }, '🌤 Minimum Day'),
      UI.el('p', { class: 'small', style: 'color:var(--clay);' }, 'Today doesn\u2019t need to be perfect. Just protect the basics.'),
    ]);
    minimumDay.items.forEach((item, i) => {
      const row = UI.el('label', { style: 'display:flex; align-items:center; gap:8px; width:100%;' }, [
        UI.el('input', { type: 'checkbox', ...(item.done ? { checked: 'checked' } : {}), onchange: async (e) => {
          item.done = e.target.checked;
          const note = (await DB.get('dailyNotes', viewDate)) || { date: viewDate };
          note.minimumDay = minimumDay;
          await DB.put('dailyNotes', note);
        } }),
        UI.el('span', { class: 'small' }, item.label),
      ]);
      box.appendChild(row);
    });
    box.appendChild(UI.el('button', { class: 'btn-link', style: 'color:var(--clay);', onclick: async () => {
      const note = (await DB.get('dailyNotes', viewDate)) || { date: viewDate };
      note.minimumDay = { active: false, items: [] };
      await DB.put('dailyNotes', note);
      render(document.getElementById('screen-today'));
    } }, 'End Minimum Day') );
    return box;
  }

  function openMinimumDayPicker(trackers) {
    UI.openSheet((close) => {
      const wrap = UI.el('div', { class: 'stack' });
      wrap.appendChild(UI.el('p', {}, 'What are the few things that matter today? Choose up to 3.'));
      const chosen = new Set();
      const grid = UI.el('div', { class: 'chip-grid' });
      trackers.slice(0, 12).forEach((t) => {
        const chip = UI.el('div', { class: 'chip', onclick: () => {
          if (chosen.has(t.id)) { chosen.delete(t.id); chip.classList.remove('active'); }
          else if (chosen.size < 3) { chosen.add(t.id); chip.classList.add('active'); }
          else { UI.toast('Pick up to 3'); }
        } }, `${t.icon} ${t.name}`);
        grid.appendChild(chip);
      });
      wrap.appendChild(grid);
      wrap.appendChild(UI.el('button', { class: 'btn btn-primary btn-block', style: 'margin-top:16px;', onclick: async () => {
        if (chosen.size === 0) { UI.toast('Choose at least one thing'); return; }
        const items = [...chosen].map((id) => {
          const t = trackers.find((tt) => tt.id === id);
          return { label: `${t.icon} ${t.name}`, done: false };
        });
        const note = (await DB.get('dailyNotes', viewDate)) || { date: viewDate };
        note.minimumDay = { active: true, items };
        await DB.put('dailyNotes', note);
        close();
        render(document.getElementById('screen-today'));
      } }, 'Start Minimum Day'));
      return wrap;
    }, { title: 'Minimum Day' });
  }

  function renderTrackerCard(tracker, entry, root) {
    const reached = entry ? Trackers.goalReached(tracker, entry.value) : null;
    const card = UI.el('div', { class: `tracker-card${reached === true ? ' reached' : ''}` });
    card.appendChild(UI.el('span', { class: 'icon' }, tracker.icon));
    const main = UI.el('div', { class: 'main' });
    const goalLabel = Trackers.goalLabel(tracker);
    main.appendChild(UI.el('div', { class: 'name-row' }, [
      UI.el('span', { class: 'name', onclick: () => TrackerEditor.open(tracker, () => render(root)) }, tracker.name),
      reached === true ? UI.el('span', { class: 'goal-check' }, '✓ Goal reached') : null,
    ]));
    if (goalLabel) main.appendChild(UI.el('div', { class: 'goal-text' }, `Goal: ${goalLabel}`));

    const inputRow = UI.el('div', { class: 'input-row' });
    buildInput(tracker, entry, inputRow, root);
    main.appendChild(inputRow);
    card.appendChild(main);
    return card;
  }

  async function saveValue(tracker, value, root) {
    await Trackers.setEntry(tracker.id, viewDate, value);
    UI.toast('Saved');
    render(root);
  }

  function buildInput(tracker, entry, container, root) {
    const val = entry ? entry.value : undefined;
    switch (tracker.type) {
      case 'number':
      case 'currency': {
        const step = tracker.type === 'currency' ? 1 : 0.1;
        const input = UI.el('input', { class: 'value-input', type: 'number', inputmode: 'decimal', step: 'any',
          value: val ?? '', placeholder: tracker.unit ? `0 ${tracker.unit}` : '0' });
        input.addEventListener('change', () => { if (input.value !== '') saveValue(tracker, Number(input.value), root); });
        container.appendChild(UI.el('button', { class: 'stepper-btn', onclick: () => saveValue(tracker, round2((Number(input.value) || 0) - step), root) }, '−'));
        container.appendChild(input);
        container.appendChild(UI.el('button', { class: 'stepper-btn', onclick: () => saveValue(tracker, round2((Number(input.value) || 0) + step), root) }, '+'));
        if (tracker.unit) container.appendChild(UI.el('span', { class: 'small muted' }, tracker.unit));
        break;
      }
      case 'count': {
        const input = UI.el('input', { class: 'value-input', type: 'number', inputmode: 'numeric', step: '1', value: val ?? '', placeholder: '0' });
        input.addEventListener('change', () => { if (input.value !== '') saveValue(tracker, Number(input.value), root); });
        container.appendChild(input);
        if (tracker.unit) container.appendChild(UI.el('span', { class: 'small muted' }, tracker.unit));
        break;
      }
      case 'duration': {
        const input = UI.el('input', { class: 'value-input', type: 'number', inputmode: 'numeric', step: '1', value: val ?? '', placeholder: 'minutes' });
        input.addEventListener('change', () => { if (input.value !== '') saveValue(tracker, Number(input.value), root); });
        container.appendChild(input);
        container.appendChild(UI.el('span', { class: 'small muted' }, tracker.unit || 'min'));
        break;
      }
      case 'time': {
        const input = UI.el('input', { class: 'value-input', type: 'time', value: val || '' });
        input.addEventListener('change', () => { if (input.value) saveValue(tracker, input.value, root); });
        container.appendChild(input);
        break;
      }
      case 'yesno': {
        const toggle = UI.el('div', { class: 'yesno-toggle' }, [
          UI.el('button', { class: val === true || val === 'true' ? 'on' : '', onclick: () => saveValue(tracker, true, root) }, 'Yes'),
          UI.el('button', { class: val === false || val === 'false' ? 'on' : '', onclick: () => saveValue(tracker, false, root) }, 'No'),
        ]);
        container.appendChild(toggle);
        break;
      }
      case 'rating': {
        const group = UI.el('div', { class: 'pill-group' });
        [1, 2, 3, 4, 5].forEach((n) => group.appendChild(UI.el('div', { class: `pill${Number(val) === n ? ' active' : ''}`, onclick: () => saveValue(tracker, n, root) }, String(n))));
        container.appendChild(group);
        break;
      }
      case 'choice': {
        const group = UI.el('div', { class: 'pill-group' });
        (tracker.choiceOptions || []).forEach((opt) => group.appendChild(UI.el('div', { class: `pill${val === opt ? ' active' : ''}`, onclick: () => saveValue(tracker, opt, root) }, opt)));
        container.appendChild(group);
        break;
      }
      case 'text': {
        const input = UI.el('input', { class: 'value-input wide', type: 'text', value: val || '', placeholder: 'Tap to add…' });
        input.addEventListener('change', () => saveValue(tracker, input.value, root));
        container.appendChild(input);
        break;
      }
      default:
        container.appendChild(UI.el('span', { class: 'muted small' }, 'Unsupported type'));
    }
  }

  function renderDailyNote(note) {
    const n = note || {};
    const wrap = UI.el('div', {}, [UI.el('h3', { class: 'section-title' }, 'Daily note')]);
    const card = UI.el('div', { class: 'tracker-card', style: 'flex-direction:column; align-items:stretch; gap:10px;' });

    const rows = UI.el('div', { class: 'field-row' });
    const moodGroup = UI.el('div', {}, [UI.el('div', { class: 'small muted', style: 'margin-bottom:5px;' }, 'Mood'), pillRow(n.mood, async (v) => { await saveNoteField('mood', v); })]);
    const energyGroup = UI.el('div', {}, [UI.el('div', { class: 'small muted', style: 'margin-bottom:5px;' }, 'Energy'), pillRow(n.energy, async (v) => { await saveNoteField('energy', v); })]);
    rows.appendChild(moodGroup);
    rows.appendChild(energyGroup);
    card.appendChild(rows);

    const textarea = UI.el('textarea', { placeholder: 'Today felt good because…', class: '' }, n.note || '');
    textarea.style.width = '100%'; textarea.style.border = '1px solid var(--border)'; textarea.style.borderRadius = '8px';
    textarea.style.padding = '9px'; textarea.style.background = 'var(--surface)'; textarea.style.color = 'var(--ink)'; textarea.style.minHeight = '56px';
    textarea.addEventListener('change', () => saveNoteField('note', textarea.value));
    card.appendChild(textarea);

    const goodThing = UI.el('input', { type: 'text', class: 'value-input wide', placeholder: 'One good thing today', value: n.goodThing || '' });
    goodThing.addEventListener('change', () => saveNoteField('goodThing', goodThing.value));
    card.appendChild(goodThing);

    wrap.appendChild(card);
    return wrap;

    function pillRow(current, onPick) {
      const group = UI.el('div', { class: 'pill-group' });
      [1, 2, 3, 4, 5].forEach((v) => group.appendChild(UI.el('div', { class: `pill${Number(current) === v ? ' active' : ''}`, onclick: () => {
        group.querySelectorAll('.pill').forEach((p) => p.classList.remove('active'));
        group.children[v - 1].classList.add('active');
        onPick(v);
      } }, String(v))));
      return group;
    }

    async function saveNoteField(field, value) {
      const existing = (await DB.get('dailyNotes', viewDate)) || { date: viewDate };
      existing[field] = value;
      await DB.put('dailyNotes', existing);
      UI.toast('Saved');
    }
  }

  function round2(n) { return Math.round(n * 100) / 100; }

  function setViewDate(key) { viewDate = key; }
  function getViewDate() { return viewDate; }

  return { render, setViewDate, getViewDate };
})();

// ============================================================================
// trends.js — automatic per-tracker visualizations across selectable windows.
// ============================================================================

const TrendsScreen = (() => {
  const RANGES = [
    { key: '7d', label: '7 days', days: 7 },
    { key: '30d', label: '30 days', days: 30 },
    { key: '3m', label: '3 months', days: 90 },
    { key: '6m', label: '6 months', days: 182 },
    { key: '1y', label: '1 year', days: 365 },
    { key: 'all', label: 'All time', days: null },
  ];
  let activeRange = '30d';

  function timeToMinutes(t) { if (!t) return null; const [h, m] = String(t).split(':').map(Number); return h * 60 + m; }
  function minutesToTime(mins) { const h = Math.floor(mins / 60) % 24; const m = Math.round(mins % 60); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }

  async function render(root) {
    root.innerHTML = '';
    root.appendChild(UI.el('h1', { class: 'section-title', style: 'margin-top:4px;' }, 'Trends'));

    const tabs = UI.el('div', { class: 'range-tabs' });
    RANGES.forEach((r) => {
      const btn = UI.el('button', { class: r.key === activeRange ? 'active' : '', onclick: () => { activeRange = r.key; render(root); } }, r.label);
      tabs.appendChild(btn);
    });
    root.appendChild(tabs);

    const trackers = (await Trackers.listTrackers()).filter((t) => t.type !== 'text' && t.type !== 'yesno' && t.type !== 'choice');
    const yesNoTrackers = (await Trackers.listTrackers()).filter((t) => t.type === 'yesno');

    if (trackers.length === 0 && yesNoTrackers.length === 0) {
      root.appendChild(UI.el('div', { class: 'empty-state' }, [
        UI.el('h3', {}, 'No trends yet'),
        UI.el('p', {}, 'Once you log a few days of a number, time, duration or rating tracker, its chart shows up here.'),
      ]));
      return;
    }

    const rangeDef = RANGES.find((r) => r.key === activeRange);
    const endKey = DateUtil.todayKey();
    let startKey;
    if (rangeDef.days === null) startKey = '2000-01-01'; else startKey = DateUtil.addDays(endKey, -(rangeDef.days - 1));

    for (const tracker of trackers) {
      root.appendChild(await renderTrendCard(tracker, startKey, endKey));
    }
    for (const tracker of yesNoTrackers) {
      root.appendChild(await renderYesNoCard(tracker, startKey, endKey));
    }
  }

  async function renderTrendCard(tracker, startKey, endKey) {
    let entries = await Trackers.entriesInRange(tracker.id, startKey, endKey);
    const createdKey = tracker.createdAt ? DateUtil.toDateKey(new Date(tracker.createdAt)) : startKey;
    const effStart = startKey > createdKey ? startKey : createdKey;
    entries = entries.filter((e) => e.date >= effStart);

    const card = UI.el('div', { class: 'trend-card' });
    card.appendChild(UI.el('div', { class: 'head' }, [
      UI.el('span', { class: 'icon' }, tracker.icon),
      UI.el('span', { class: 'name' }, tracker.name),
    ]));

    if (entries.length === 0) {
      card.appendChild(UI.el('p', { class: 'muted small' }, 'Not enough data yet — log a few days to see this chart.'));
      return card;
    }

    const isTime = tracker.type === 'time';
    const isRating = tracker.type === 'rating';
    const points = entries.map((e) => ({ x: e.date, y: isTime ? timeToMinutes(e.value) : Number(e.value) }));
    const canvas = UI.el('canvas');
    card.appendChild(canvas);
    const goalNum = tracker.goalDirection !== 'none' && tracker.goal !== null && tracker.goal !== undefined && tracker.goal !== ''
      ? (isTime ? timeToMinutes(tracker.goal) : Number(tracker.goal)) : null;
    requestAnimationFrame(() => {
      Charts.drawLineChart(canvas, points, {
        goal: goalNum,
        formatY: (v) => (isTime ? minutesToTime(v) : (isRating ? v.toFixed(1) : Math.round(v * 10) / 10)),
      });
    });

    const values = points.map((p) => p.y).filter((v) => v !== null && !Number.isNaN(v));
    const current = values[values.length - 1];
    const starting = values[0];
    const change = current - starting;
    const avg = values.reduce((a, b) => a + b, 0) / values.length;
    const cons = await Trackers.consistency(tracker, startKey, endKey);

    const fmt = (v) => (isTime ? minutesToTime(v) : (Math.round(v * 100) / 100));
    const stats = UI.el('div', { class: 'trend-stats' }, [
      statBox(fmt(current), 'Current'),
      statBox(fmt(avg), 'Average'),
      statBox(`${change > 0 ? '+' : ''}${fmt(change)}`, 'Change'),
    ]);
    card.appendChild(stats);
    const stats2 = UI.el('div', { class: 'trend-stats' }, [
      statBox(tracker.goal ? Trackers.goalLabel(tracker) : '—', 'Goal'),
      statBox(cons.expected ? `${cons.pct}%` : '—', 'Consistency'),
      statBox(`${entries.length}/${DateUtil.daysBetween(effStart, endKey) + 1}`, 'Days logged'),
    ]);
    card.appendChild(stats2);
    return card;
  }

  async function renderYesNoCard(tracker, startKey, endKey) {
    let entries = await Trackers.entriesInRange(tracker.id, startKey, endKey);
    const card = UI.el('div', { class: 'trend-card' });
    card.appendChild(UI.el('div', { class: 'head' }, [
      UI.el('span', { class: 'icon' }, tracker.icon),
      UI.el('span', { class: 'name' }, tracker.name),
    ]));
    if (entries.length === 0) {
      card.appendChild(UI.el('p', { class: 'muted small' }, 'Not enough data yet.'));
      return card;
    }
    const dateKeys = DateUtil.dateRangeKeys(startKey, endKey);
    const byDate = new Map(entries.map((e) => [e.date, e]));
    const bars = dateKeys.slice(-30).map((d) => ({ label: DateUtil.formatShort(d).slice(0, 2), value: byDate.has(d) ? (byDate.get(d).value === true || byDate.get(d).value === 'true' ? 1 : 0.05) : 0 }));
    const canvas = UI.el('canvas');
    card.appendChild(canvas);
    requestAnimationFrame(() => Charts.drawBarChart(canvas, bars, { formatY: (v) => v }));
    const yesCount = entries.filter((e) => e.value === true || e.value === 'true').length;
    const cons = await Trackers.consistency(tracker, startKey, endKey);
    card.appendChild(UI.el('div', { class: 'trend-stats' }, [
      statBox(`${yesCount}/${entries.length}`, 'Yes days'),
      statBox(cons.expected ? `${cons.pct}%` : '—', 'Consistency'),
      statBox(entries.length, 'Logged'),
    ]));
    return card;
  }

  function statBox(value, label) {
    return UI.el('div', { class: 'trend-stat' }, [UI.el('div', { class: 'num' }, String(value)), UI.el('div', { class: 'lbl' }, label)]);
  }

  return { render };
})();

window.TrendsScreen = TrendsScreen;
